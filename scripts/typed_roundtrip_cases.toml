# Each capability selects a group, never a per-case executable.
[[groups]]
capability = "values"
cases = [
  "list_beyond_i64",
  "bool_list",
  "float_negative_zero",
  "float_special_values",
  "int_key_dict",
  "bool_key_dict",
  "date_key_dict",
  "dict_wide_int_key",
  "date_list",
  "scalar_datetime_naive",
  "scalar_datetime_microsecond",
  "scalar_datetime_non_utc",
  "dict_all_scalar_types",
  "binary_octets",
]
stems = ["{backend}"]

[[groups]]
capability = "values"
cases = ["float_extreme_magnitudes", "subnormal_and_minimum_normal_floats"]
stems = ["{backend}_float_format_scientific"]

[[groups]]
capability = "values"
cases = ["scientific_float_precision"]
stems = ["{backend}_float_format_scientific_precision"]

[[groups]]
capability = "native-bytes"
cases = ["binary_octets", "binary_nonempty_octets"]
stems = ["{backend}_bytes_format_python"]
bytes_format = "native"

[[groups]]
capability = "values"
cases = ["binary_octets"]
stems = ["{backend}_bytes_format_base64"]
bytes_format = "base64"

[[groups]]
capability = "records"
cases = ["record_pure_scalars"]
stems = ["{backend}_heterogeneous_strategy_record"]

[[groups]]
capability = "values"
cases = ["scalar_datetime_non_utc"]
stems = ["{backend}_datetime_epoch_non_utc"]
datetime_format = "epoch"

[[groups]]
capability = "iso-datetime"
cases = ["scalar_datetime_non_utc"]
stems = ["{backend}_datetime_iso_non_utc"]
datetime_format = "iso"

[[groups]]
capability = "fractional-offsets"
cases = ["native_datetime_ruby_offsets"]
stems = ["{backend}"]
