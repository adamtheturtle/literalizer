---
name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request: {}

# Cancel superseded main pushes and updates to each PR.
# Other invocations keep their own group.
concurrency:
  group: >-
    deploy-docs-${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
    && 'push-main' || format('pr-{0}', github.event.pull_request.number || github.run_id)
    }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'development' }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: docs/source
          pyproject_group: dev
          python_version: '3.13'
          sphinx_build_options: -W
          publish: ${{ github.ref_name == 'main' }}
          enablement: ${{ github.ref_name == 'main' }}
