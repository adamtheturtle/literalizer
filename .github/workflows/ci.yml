---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: 0 1 * * *

permissions: {}

# Cancel superseded PR and main-push runs to reduce runner contention.
# Main-push cancellation trades intermediate benchmark history and failure
# evidence for validating the latest main. Scheduled/manual runs stay unique.
concurrency:
  group: >-
    ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
    && 'push-main' || format('pr-{0}', github.event.pull_request.number || github.run_id)
    }}
  cancel-in-progress: true

jobs:
  build:
    needs: [benchmark-wheel]
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    # Python 3.12's full golden suite reaches the 30-minute Windows limit.
    timeout-minutes: ${{ matrix.python-version == '3.12' && 60 || 30 }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: benchmark-wheel
          path: dist

      - name: Create the test environment
        shell: bash
        run: uv venv --python "$UV_PYTHON"
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      # PyPI may expose metadata before every transitive artifact is ready.
      # Retry installation in this matrix cell, refreshing index metadata
      # while retaining downloaded wheels and the existing environment.
      - name: Install test dependencies
        timeout-minutes: 13
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: uv pip install --refresh --group=test dist/*.whl

      - name: Check the installed wheel
        run: >-
          uv run --no-sync python -c "from pathlib import Path; import literalizer;
          assert Path(literalizer.__file__).resolve().is_relative_to(Path('.venv').resolve())"

      - name: Run tests
        shell: bash
        # Keep all tests and beartype checks in every matrix cell. Measure
        # branch coverage on Python 3.14/3.15 for each change, and on every
        # supported version nightly. Older-Python-only coverage regressions
        # are therefore detected nightly rather than blocking each PR.
        run: |
          coverage_args=(--no-cov)
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            coverage_args=(--cov --cov-config=pyproject.toml)
          fi
          printf 'Measure coverage: %s\n' "$MEASURE_COVERAGE"
          uv run --no-sync python -m pytest -p scripts.pytest_worker_timing \
            -v -o verbosity_test_cases=0 \
            --dist=worksteal --durations=20 \
            --ignore=tests/benchmarks . "${coverage_args[@]}"
        env:
          MEASURE_COVERAGE: >-
            ${{ github.event_name == 'schedule' || matrix.python-version == '3.14'
            || matrix.python-version == '3.15' }}
          # Keep execution and coverage on the same checkout, as with the
          # previous editable installation. The installed wheel is checked
          # separately above before this source-path override is applied.
          PYTHONPATH: src

  # Build once for both the test matrix and benchmark shards. Installing
  # this wheel avoids repeating the setuptools metadata and editable-build
  # work in every Python/platform cell.
  benchmark-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-wheel
          path: dist/*.whl
          retention-days: 1

  benchmarks:
    name: benchmarks (${{ matrix.shard }})
    needs: [benchmark-wheel]

    strategy:
      # A shard that fails still leaves the other shards' timings worth
      # having, and CodSpeed reports on whatever it receives.
      fail-fast: false
      matrix:
        # Three shards balance benchmark execution against repeated profiler
        # startup and runner demand. pytest-test-groups assigns the complete
        # benchmark inventory round-robin without dropping any cases.
        #
        # Keep in sync with ``--test-group-count`` below.
        shard: [1, 2, 3]

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: benchmark-wheel
          path: dist

      - name: Create the benchmark environment
        run: uv venv --python 3.14.8 --managed-python

      - name: Install benchmark dependencies
        timeout-minutes: 13
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: uv pip install --refresh --group=benchmark dist/*.whl

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.1
        with:
          mode: simulation
          run: .venv/bin/python -m pytest tests/benchmarks --codspeed -o addopts=
            --test-group-count=3 --test-group=${{ matrix.shard }}
        env:
          # Benchmark the checkout rather than the copy of the same code
          # inside the virtual environment, so CodSpeed's call graph maps
          # back onto ``src/``.
          PYTHONPATH: src
          # Keep string hashing consistent across benchmark processes.
          PYTHONHASHSEED: '0'

  objectivec-format:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install tests and the pinned independent formatter
        run: uv sync --no-dev --group=test --group=source-format --python=3.14
      - name: Check freshly generated canonical programs
        run: >-
          uv run --no-sync python -m pytest
          tests/integration/test_literalize_golden.py
          tests/integration/test_calls.py
          tests/integration/test_literalize_ref_golden.py
          tests/integration/test_literalize_ref_default.py
          tests/integration/test_native_invocations.py
          tests/integration/test_constructor_targets.py
          -m canonical_source --check-source-format
      - name: Prove rendering needs no formatter
        run: uv run --no-sync python -m pytest tests/errors/test_source_layout.py
      - name: Prove the oracle rejects a syntax-preserving defect
        run: uv run --no-sync python -m scripts.check_objective_c_format_negative_control

  completion-ci:
    needs: [build, benchmark-wheel, benchmarks, objectivec-format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !cancelled() }}
    steps:
      - name: Check matrix job status
        run: |-
          if ! ${{ needs.build.result == 'success' && needs['benchmark-wheel'].result == 'success' && needs.benchmarks.result == 'success' && needs['objectivec-format'].result == 'success' }}; then
            echo "One or more matrix jobs failed"
            exit 1
          fi
