---
name: Mojo thread budget measurements

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  measure-mojo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 78c69ca58a9eae55d61fe8a87238cc4810a11b2a
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
      - name: Install pinned Mojo
        run: "uv tool install mojo-compiler==1.2.0\nmojo --version"
      - name: Record runner resources
        run: "nproc\nlscpu\nfree -m"
      - name: Compare compiler thread budgets
        timeout-minutes: 30
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import shutil
          import subprocess
          import time

          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source_sha == "78c69ca58a9eae55d61fe8a87238cc4810a11b2a", source_sha
          files = sorted(Path("tests/integration/cases").rglob("*.mojo"))
          assert len(files) == 1042, len(files)
          sample = {files[index * len(files) // 192] for index in range(192)}
          sample.add(Path("tests/integration/cases/deep_singleton_sequences/Mojo@v24_5.mojo"))
          assert all(path.is_file() for path in sample)
          sample = sorted(sample)
          file_list = b"".join(os.fsencode(path) + b"\0" for path in sample)
          results_dir = Path(os.environ["RUNNER_TEMP"]) / "mojo-thread-results"
          results_dir.mkdir()
          inventory = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          (results_dir / "inventory.json").write_text(json.dumps({
              "source_sha": source_sha,
              "fixtures": inventory,
              "sample": [str(path) for path in sample],
          }, indent=2))
          real_mojo = shutil.which("mojo")
          assert real_mojo is not None
          shim_dir = results_dir / "bin"
          shim_dir.mkdir()
          shim = shim_dir / "mojo"
          pool = Path("scripts/.mojo-thread-benchmark-pool.sh")
          pool_source = Path("scripts/lint-mojo.sh").read_text()
          assert pool_source.count('xargs -0 -P 4 -n1') == 1
          settings = {
              "auto4": (4, None),
              "single4": (4, 1),
              "double2": (2, 2),
          }
          order = ["auto4", "single4", "double2", "double2", "single4", "auto4"]
          results = []
          try:
              for index, mode in enumerate(order):
                  workers, threads = settings[mode]
                  if threads is None:
                      shim_text = f'#!/usr/bin/env bash\nset -euo pipefail\nexec {shlex.quote(real_mojo)} "$@"\n'
                  else:
                      shim_text = (
                          '#!/usr/bin/env bash\nset -euo pipefail\n'
                          'if [[ "$1" == run ]]; then\n  shift\n'
                          f'  exec {shlex.quote(real_mojo)} run --num-threads {threads} "$@"\n'
                          'fi\n'
                          f'exec {shlex.quote(real_mojo)} "$@"\n'
                      )
                  shim.write_text(shim_text)
                  shim.chmod(0o755)
                  pool.write_text(pool_source.replace('xargs -0 -P 4 -n1', f'xargs -0 -P {workers} -n1'))
                  pool.chmod(0o755)
                  label = f"{index + 1}-{mode}"
                  log_path = results_dir / f"{label}.log"
                  resource_path = results_dir / f"{label}.resources.json"
                  print(f"START {label}: {len(sample)} fixtures, workers={workers}, compiler_threads={threads}", flush=True)
                  started = time.monotonic()
                  with log_path.open("w") as log:
                      completed = subprocess.run([
                          "/usr/bin/time", "--quiet", "-o", str(resource_path), "-f",
                          '{"wall_seconds":%e,"user_seconds":%U,"system_seconds":%S,"max_rss_kib":%M,"exit_status":%x}',
                          str(pool),
                      ], input=file_list, stdout=log, stderr=subprocess.STDOUT,
                          env=dict(os.environ, PATH=str(shim_dir) + os.pathsep + os.environ["PATH"]))
                  log_text = log_path.read_text()
                  ends = re.findall(r": END .*?\(status (\d+);", log_text)
                  peak = re.search(r"Mojo pool memory.peak=(\d+)", log_text)
                  result = {
                      "label": label, "mode": mode, "workers": workers, "compiler_threads": threads,
                      "wall_seconds": round(time.monotonic() - started, 3),
                      "exit_code": completed.returncode, "completed_fixtures": len(ends),
                      "failed_fixtures": sum(code != "0" for code in ends),
                      "pool_peak_bytes": int(peak.group(1)) if peak else None,
                      "resources": json.loads(resource_path.read_text()),
                  }
                  results.append(result)
                  (results_dir / "results.json").write_text(json.dumps(results, indent=2))
                  print(json.dumps(result), flush=True)
                  if completed.returncode != 0 or len(ends) != len(sample) or any(code != "0" for code in ends):
                      print(log_text[-12000:], flush=True)
                      raise SystemExit(1)
          finally:
              pool.unlink(missing_ok=True)
              shim.unlink(missing_ok=True)
          PY
      - name: Upload measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mojo-thread-results
          path: ${{ runner.temp }}/mojo-thread-results
          retention-days: 7
