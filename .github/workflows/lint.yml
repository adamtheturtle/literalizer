name: Lint

on:
  workflow_dispatch: {}

permissions: {}
env:
  DOWNLOAD_COMMAND: |
    mkdir -p "$(dirname "$ARTIFACT_DESTINATION")"
    temporary=$(mktemp "${ARTIFACT_DESTINATION}.XXXXXX")
    trap 'rm -f "$temporary"' EXIT
    printf 'download %s\n' "$ARTIFACT_URL"
    curl --fail --show-error --silent --location \
      --connect-timeout 10 --max-time 30 \
      --write-out 'download HTTP %{http_code}\n' \
      "$ARTIFACT_URL" --output "$temporary"
    mv "$temporary" "$ARTIFACT_DESTINATION"

jobs:
  lint-mojo:
    name: lint-mojo (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        corpus:
        - baseline
        - expanded
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Restore frozen expanded Mojo corpus
      if: ${{ matrix.corpus == 'expanded' }}
      run: "git fetch --no-tags --depth=1 origin 23398025e120ec811d0f78a7ff08369df984dda3\n\
        find tests/integration/cases -name '*.mojo' -delete\ngit ls-tree -r --name-only
        FETCH_HEAD -- tests/integration/cases | grep '\\.mojo$' > /tmp/mojo-paths\n\
        git checkout FETCH_HEAD --pathspec-from-file=/tmp/mojo-paths"
    - name: Find files to lint
      shell: bash
      run: find tests/integration/cases -name '*.mojo' -print0 > 
        /tmp/files-to-lint && test -s /tmp/files-to-lint
    - name: Install uv
      timeout-minutes: 10
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: '**/pyproject.toml'
      # ``mojo-compiler==1.0.0`` is >= the ``VersionFormats.V24_5``
      # value of ``Mojo.language_version`` in
      # ``src/literalizer/languages/mojo.py``; keep them in sync.
    - name: Install Mojo
      timeout-minutes: 10
      env:
        MOJO_VERSION: 1.0.0
      run: |-
        if [[ "$MOJO_VERSION" == latest ]]; then
          uv tool install mojo-compiler
        else
          uv tool install "mojo-compiler==$MOJO_VERSION"
        fi
        mojo --version
    - name: Check Mojo syntax
      run: |-
        printf 'Mojo compiler workers: 2; fixture budget: 60s + 10s termination\n'
        free -m
        df -h /tmp
        tr '\0' '\n' < /tmp/files-to-lint | wc -l
        status=0
        /usr/bin/time -f 'SWEEP elapsed=%es max_rss=%MKiB exit=%x' xargs -0 -P 2 -n1 scripts/lint-mojo-fixture.sh < /tmp/files-to-lint 2>&1 | tee /tmp/mojo-sweep.log || status=${PIPESTATUS[0]}
        free -m
        exit "$status"
      # Basic JSON -> Mojo -> JSON round-trip (issue 2664). Runs here
      # because this is the job with the Mojo toolchain; `uv run`
      # (project mode, not `--no-project`) is required so `import
      # literalizer` resolves *and* so uv's managed CPython is on PATH for
      # the script's `std.python` JSON interop. See
      # `scripts/run_mojo_roundtrip.py`.
    - name: Mojo roundtrip
      if: ${{ !cancelled() }}
      timeout-minutes: 1
      run: uv run python -m scripts.run_mojo_roundtrip

    - name: Upload complete sweep diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v6
      with:
        name: mojo-${{ matrix.corpus }}
        path: /tmp/mojo-sweep.log
