---
name: Backfill stack benchmark baselines

run-name: Benchmark baseline at ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact existing commit whose benchmark baseline is missing
        required: true
        type: string
      source_ref:
        description: Existing refs/heads branch containing that exact commit
        required: true
        type: string

permissions: {}

jobs:
  benchmark-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # CodSpeed reads GITHUB_REF as the measured branch. This workflow lives
      # on a separate operational branch; validate the real source ref and
      # commit before giving that source identity to the benchmark process.
      GITHUB_REF: ${{ inputs.source_ref }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |-
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/heads/codex/* ]]
          test "$GITHUB_REF" = "$SOURCE_REF"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify measured checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: Create the benchmark environment
        run: |-
          uv venv --python 3.14.8 --managed-python
          uv pip install .
          uv pip install --group=benchmark
      - name: Measure the complete benchmark suite
        uses: CodSpeedHQ/action@v5.5.0
        with:
          mode: simulation
          run: .venv/bin/python -m pytest tests/benchmarks --codspeed -o addopts=
        env:
          PYTHONPATH: src
          PYTHONHASHSEED: '0'
