---
name: Odin 6298 release validation

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  lint-odin:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    # Normal runs finish in minutes.  If the compiler, setup action, or
    # cleanup hangs, stop this job promptly instead of leaving the
    # completion gate blocked until the workflow-wide timeout.
    timeout-minutes: 20
    # Use an explicitly validated release (issue 6298), rather than
    # allowing `release: latest` to change the compiler between runs.
    # Every Odin fixture on disk carries the
    # tag from ``Odin.VersionFormats`` (e.g. `Odin@dev_2024.odin`); the
    # compiler pin here and that enum member name are reviewed together.
    env:
      ODIN_VERSION: dev-2026-11a
      ODIN_FIXTURE_TAG: dev_2024
      ODIN_SHARD: ${{ matrix.shard }}
      ODIN_SHARDS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Odin
        timeout-minutes: 10
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_VERSION }}
      - name: Run Odin files
        run: |-
          mapfile -d '' -t files < <(python3 -m tests.integration.list_fixtures .odin "$ODIN_FIXTURE_TAG")
          n=${#files[@]}
          test "$n" -gt 0
          for (( i=ODIN_SHARD; i<n; i+=ODIN_SHARDS )); do
            src=$(realpath "${files[i]}")
            # Print before running so a timeout log identifies the
            # fixture to minimize for an upstream Odin bug report.
            printf 'Running %s\n' "$src"
            bash scripts/lint-odin-fixture.sh "$src"
          done
      # `uv` is needed by the `Odin roundtrip` step below; it runs the
      # helper in project mode so `import literalizer` resolves.
      - name: Install uv
        timeout-minutes: 10
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      # Basic JSON -> Odin -> JSON round-trip (issue 2670). Runs here
      # because this is the job with the Odin toolchain; `uv run`
      # (project mode, not `--no-project`) is required so `import
      # literalizer` resolves.
      # See `scripts/run_odin_roundtrip.py`.
      # Include cold project-environment setup in this step's budget.
      - name: Odin roundtrip
        timeout-minutes: 3
        run: uv run --no-dev --group=roundtrip python -m scripts.run_odin_roundtrip

      - name: Repeated reduced compiler reproducer
        if: matrix.shard == 0
        timeout-minutes: 10
        run: |
          odin report
          uname -a
          sha256sum "$(command -v odin)"
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          cat > "$workspace/main.odin" <<'ODIN'
          #+feature dynamic-literals
          package main
          main :: proc() {
              _ = [dynamic]any{map[string]any{}}
          }
          ODIN
          cd "$workspace"
          for (( attempt=1; attempt<=400; attempt++ )); do
            timeout --kill-after=10s 60s odin build . -out:repro.bin
            if (( attempt % 25 == 0 )); then
              printf 'Reduced reproducer: %s/400 first-attempt builds passed\n' "$attempt"
            fi
          done
