---
name: autofix.ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# Only the latest main push needs fixes; other invocations stay independent.
concurrency:
  group: >-
    autofix-${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
    && 'push-main' || format('run-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Run fixers
        uses: j178/prek-action@v3.1.0
        with:
          # Matches the ``prek`` pin in ``pyproject.toml``; keep them in
          # sync. prek reimplements the ``pre-commit-hooks`` checks
          # natively, so a version difference changes their verdicts and
          # not merely their scheduling (issue 4013).
          prek-version: 0.5.6
          extra-args: >-
            --all-files --hook-stage pre-commit --no-fail-fast --verbose
        env:
          UV_NO_CACHE: '1'
          UV_PYTHON: 3.14

      - uses: autofix-ci/action@v1.3.4
        if: always()
