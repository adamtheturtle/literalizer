---
# Native jobs match their fixtures, language modules, manifests and runners.
# Common renderer, fixture inventory and runner inputs select every job.
shared: &shared
  - src/literalizer/*
  - src/literalizer/_formatters/**
  - src/literalizer/languages/__init__.py
  - scripts/{__init__,bounded_command,fixture_staging,roundtrip_common,shared_record_common}.py
  - scripts/{roundtrip_input,roundtrip_capability_input}.json
  - scripts/{retry,run-bounded}.sh
  - tests/*.py
  - tests/integration/*.py
  - tests/integration/*.toml
  - tests/integration/cases/**/case.toml
  - tests/integration/cases/**/input.*
  - .github/workflows/lint.yml
  - .github/native-filters.yml
  - pyproject.toml
  - uv.lock

lint-fast:
  - *shared
  - '{src/literalizer/languages,tests/integration/languages}/{bash,c,dhall,forth,fortran,java,javascript,lua,nix,php,powershell,ruby,scheme,tcl,wren}.{py,toml}'
  - scripts/run_{bash,c,dhall,forth,fortran,java,javascript,lua,nix,php,powershell,ruby,scheme,tcl,wren}{,_*}.py
  - scripts/{bash_roundtrip_json.sh,javascript_*.cjs,lua_*_consumer.lua,ruby_*.rb}
  - scripts/php_generated_call_consumer.php
  - src/literalizer/languages/forth_prelude.fs
  - scripts/run_interpreted_fixtures.py
  - scripts/{forth_visitor_lint.fs,fval_m.f90,lint-powershell.ps1,run-powershell.ps1}
  - tests/integration/cases/**/*.{c,dhall,f90,fth,java,js,lua,nix,php,ps1,rb,scm,sh,tcl,wren}
  - CheckJavaSyntax.java

lint-odin:
  - *shared
  - '{src/literalizer/languages,tests/integration/languages}/odin.{py,toml}'
  - scripts/run_odin{,_*}.py
  - scripts/lint-odin-fixture.sh
  - tests/integration/cases/**/*.odin

