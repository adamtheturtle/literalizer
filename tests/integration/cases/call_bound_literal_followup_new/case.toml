# Shared input and API context; named examples preserve specialized regression witnesses.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
followup_source = "{\"$ref\": \"my_data\"}"
followup_target_function = "consume"

[[call_examples]]
# Regression provenance: call_binding_rust_byte_raw_hashes_new
# Regression provenance: Rust. Rust raw and byte-raw string delimiters may contain quoted comment markers.
example = "call_binding_rust_byte_raw_hashes_new"
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
call_transform = "make_widget(br#\"// payload\"#) // note"
followup_source = "{\"$ref\": \"my_data\"}"
followup_target_function = "consume"

[[call_examples.gates]]
kind = "call_hash_raw_prefix"
prefix = "br"
marker = "#"

[[call_examples]]
