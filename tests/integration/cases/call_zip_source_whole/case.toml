schema_version = 1
owner = "literalize-call"

# Companion to ``call_zip_values`` exercising the ``per_element=false``
# path: the whole parsed ``zip_source`` value pairs with the single
# generated call.
[call]
target_function = "process"
parameter_names = ["value"]
per_element = false
zip_source = "--- true\n"
zip_input_format = "yaml"
requires_call_returns_expression = true

# Check zipped scalar, mapping, and wrapper operands against generated helper signatures across call options.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"

[call.transform]
kind = "wrapper"
target = "emit"

[[call.transform.arguments]]
role = "call"
parameter = "_call"

[[call.transform.arguments]]
role = "zipped"
parameter = "_zip"
