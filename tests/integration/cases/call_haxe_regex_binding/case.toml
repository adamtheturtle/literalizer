schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = '(~/\//).match("/") ? {call} : null'
wrap_in_file = true
variable_form = "new"
languages = ["Haxe"]
languages_reason = "Haxe EReg literal delimiters retain their escaped slashes during call binding."
