schema_version = 1
owner = "literalize-call"
# Regression provenance: V.
# V null pointer bindings remain usable as whole call arguments.

[call]
gates = [{kind = "capability_flag", flag = "declares_call_styles"}]
target_function = "consume"
parameter_names = ["value"]
per_element = false
ref_declarations = { value = "null" }

# Compile the shared call in annotation and collection-layout contexts.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
