schema_version = 1
owner = "constructor-binding"
gates = [{kind = "capability_flag", flag = "supports_json_object_documents"}]

# Shared JSON5/JSONC regression; also check every native JSON-object format.
# Keep the separate YAML block-map and Jsonnet local-binding contracts.
# Generate strict JSON once: it is a complete native document for every
# capability-selected consumer, including formats with other default syntax.
[constructor]
target_mapping = true
target_language = "Jsonc"
