# Shared input and API context; named examples preserve specialized regression witnesses.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "existing"

[call.fixture]
kind = "composed"

[call.fixture.ref_declarations]
my_data = "null"

[call.fixture.followup]
source = "{\"$ref\": \"my_data\"}"
target_function = "consume"

[[call_examples]]
# Regression provenance: call_shared_comments_verbatim_interpolated_nested_format_comment_existing
# Regression provenance: CSharp; The transformed call uses CSharp literal and comment syntax.
example = "call_shared_comments_verbatim_interpolated_nested_format_comment_existing"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "existing"

[[call_examples.gates]]
kind = "call_literal_flag"
flag = "verbatim_strings"

[[call_examples.gates]]
kind = "call_interpolation"
opener = "{"
quotes = "\""

[call_examples.transform]
kind = "template"
template = "($\"{{$\"{{1://}}\"}}\").Length >= 0 ? {call} : {call} // trailing\n// extra"

[call_examples.fixture]
kind = "composed"

[call_examples.fixture.ref_declarations]
my_data = "null"

# Keep existing integer and nullable result bindings valid when their values are passed to a later call.

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
