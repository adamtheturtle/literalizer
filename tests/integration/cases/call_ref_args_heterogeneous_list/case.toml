schema_version = 1
owner = "literalize-call"

# Separately declared list references retain their own element types.
# The VARIANT control accepts moved List[Int]/List[String] values through
# the Variant alias, rather than changing the parameter to List[Value].
[call]
target_function = "process"
parameter_names = ["data", "count"]
per_element = true
ref_declarations = { my_ints = "[1, 2, 3]", my_strings = "[\"a\", \"b\"]", my_empty = "[]" }
consumable_refs = ["my_empty", "my_ints", "my_strings"]

[[call.variants]]
axis = "heterogeneous_strategy"
