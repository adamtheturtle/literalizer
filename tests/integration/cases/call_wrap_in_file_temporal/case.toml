schema_version = 1
owner = "literalize-call"

# The argument values need a preamble import, which the wrapped file
# assembles alongside the target-function stub.
[call]
target_function = "check"
parameter_names = ["ts", "d"]
per_element = true
wrap_in_file = true
languages = ["Cobol", "Haskell"]
languages_reason = "Haskell requires temporal imports before declarations; COBOL must keep its wrapper program distinct from the requested CHECK target."
