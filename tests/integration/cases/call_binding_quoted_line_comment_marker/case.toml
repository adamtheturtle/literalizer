schema_version = 1
owner = "literalize-call"

# Consolidates original regressions: call_binding_quoted_comment_marker_c, call_binding_quoted_comment_marker_cpp, call_binding_quoted_comment_marker_csharp, call_binding_quoted_comment_marker_d, call_binding_quoted_comment_marker_dart, call_binding_quoted_comment_marker_haxe, call_binding_quoted_comment_marker_java, call_binding_quoted_comment_marker_objective_c, call_binding_quoted_comment_marker_systemverilog, call_binding_quoted_comment_marker_zig.
[call]
gates = [{kind = "capability_flag", flag = "declares_call_styles"}, {kind = "enum_member_present", option = "comment_format", member = "DOUBLE_SLASH"}]
target_function = "make_widget"
parameter_names = ["text"]
per_element = false
call_transform = "{call} // note\n// extra"
wrap_in_file = true
variable_form = "new"

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "multiline_string"
