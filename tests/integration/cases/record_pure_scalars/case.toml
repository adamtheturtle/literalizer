schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "heterogeneous_strategy"

[variants.consumer_templates]
Python = '''{code}
# Independent native value checks.
from dataclasses import fields, is_dataclass
assert is_dataclass(obj=my_data)
assert [field.name for field in fields(class_or_instance=my_data)] == ["name", "age", "active", "score"]
assert my_data.name == "Alice"
assert type(my_data.age) is int and my_data.age == 30
assert my_data.active is True
assert type(my_data.score) is float and my_data.score == 4.5
'''
[[variants]]
axis = "heterogeneous_value_enum_name"

[[variants]]
axis = "heterogeneous_value_union_name"

[[variants]]
axis = "heterogeneous_value_variant_name"

[[variants]]
axis = "collection_layout"

# Explicit root annotations must retain the inferred record field types.
[[variants]]
axis = "record_type_hints_always"
