schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "{call} ?\n{call} // inner\n: nil // trailing"
wrap_in_file = true
variable_form = "new"
languages = ["ObjectiveC"]
languages_reason = "An Objective-C conditional retains an inner comment without redundant parentheses rejected by clang-tidy."
