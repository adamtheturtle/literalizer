schema_version = 1
owner = "literalize-call"

[call]
target_function = "capture"
parameter_names = ["nan_value", "positive_infinity", "negative_infinity", "finite_value", "date_value", "datetime_value", "text_value"]
per_element = true
languages = ["PowerShell"]
languages_reason = "PowerShell command arguments need parentheses for type-literal expressions."

[[call.variants]]
axis = "date"

[[call.variants]]
axis = "float_format"

[[call.variants]]
axis = "datetime"
