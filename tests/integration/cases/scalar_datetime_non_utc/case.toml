schema_version = 1
golden_layout = "nested"
suites = ["base", "combined"]

[[variants]]
axis = "datetime"
suffix = "_non_utc"

[variants.consumer_templates]
Python = '''{code}
# Independent native value checks.
def check_datetime(value: object, representation: str) -> None:
    if representation == "EPOCH":
        assert type(value) is int and value == 1705321800
    else:
        import datetime as expected_datetime
        assert type(value) is expected_datetime.datetime
        assert value.isoformat() == '2024-01-15T18:00:00+05:30'
check_datetime(value=my_data, representation="{datetime_format}")
'''
Ruby = '''{code}
# Independent native value checks.
case "{datetime_format}"
when "EPOCH"
  raise "epoch value or type changed" unless my_data.instance_of?(Integer) && my_data == 1705321800
when "ISO"
  raise "ISO value or type changed" unless my_data.instance_of?(String) && my_data == "2024-01-15T18:00:00+05:30"
when "RUBY"
raise "datetime type changed" unless my_data.instance_of?(Time)
raise "datetime instant changed" unless my_data.to_r == Rational(1705321800000000, 1000000)
raise "datetime offset changed" unless my_data.utc_offset == 19800
else
  raise "unchecked datetime representation"
end
'''
[[variants]]
axis = "language_version"

