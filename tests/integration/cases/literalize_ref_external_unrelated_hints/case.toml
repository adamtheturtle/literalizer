schema_version = 1
owner = "literalize-ref-default"

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_cpp_external_unrelated_values.
# The API sees only the unrelated hint; the referenced vector is declared
# afterwards so the historical unknown-value expression can compile.
explicit_ref_value_sources = {other = "1"}

[ref.context]
kind = "external"
declarations = {missing = "[1, 2]"}

[ref.context.consumer]
kind = "value-check"
expected_source = "[1, 2]"
