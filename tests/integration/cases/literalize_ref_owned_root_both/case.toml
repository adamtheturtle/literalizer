# Also preserves literalize_ref_rust_root_both_owned: the default Rust
# redefinition style is LET_MUT, matching its former explicit override.
schema_version = 1
owner = "literalize-ref"
# Regression provenance: Cpp.
# C++ owned references must preserve every generated use.

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
variable_form = "both"

[ref.value_sources]
shared = "[1, 2]"
