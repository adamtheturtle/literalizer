# Regression provenance: Rust. Rust character literals and their escapes must not hide trailing line comments.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_character_quote", quote = "'"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
call_transform = '''
make_widget('\n') // note'''
followup_source = '{"$ref": "my_data"}'
followup_target_function = "consume"
