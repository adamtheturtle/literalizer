schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "language_version"

[[variants]]
axis = "float_format"

[[variants]]
axis = "numeric_literal_suffix"

[[variants]]
axis = "sequence"

[[variants]]
axis = "json_type"

[[variants]]
axis = "type_hints"

[[variants]]
axis = "numeric_separator"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
import struct
assert isinstance(my_data, (list, tuple))
assert all(type(value) is float for value in my_data)
assert [struct.pack("!d", value).hex() for value in my_data] == ['8000000000000000', '3ff8000000000000']
'''
Ruby = '''{code}
# Independent native value checks.
raise "float type changed" unless my_data.all? {{ |value| value.instance_of?(Float) }}
raise "float precision or sign changed" unless my_data.map {{ |value| [value].pack("G").unpack1("H*") }} == ["8000000000000000", "3ff8000000000000"]
'''
