schema_version = 1
golden_layout = "nested"
owner = "constructor-binding"
gates = [{kind = "capability_flag", flag = "supports_zero_parameter_calls", value = false}, {kind = "spec_field_absent", field = "program_name"}, {kind = "spec_field_absent", field = "null_constructor_name"}]

# Consume constructor targets in native syntax without fabricating a call.
# Generate the boolean binding through the public variable API.
[constructor]
target_variable = true

# Program identifiers are owned by constructor_target_program_document.
# Data declarations are owned by constructor_target_nullary_data_constructor.
