schema_version = 1
golden_layout = "nested"
owner = "literalize-ref-default"
# Regression provenance: Go, Python, Rust.
# External declarations retain inference while the generated root is consumed; Go and strict Rust require that use.

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}, {kind = "capability_flag", flag = "declares_call_styles"}]
explicit_ref_value_sources = {shared = "[1, 2]"}

[ref.context]
kind = "external"
declarations = {shared = "[1, 2]"}

[ref.context.consumer]
kind = "call"
target_function = "consume_widget"
