schema_version = 1
owner = "literalize-call"
# Shared coverage retains the original Cpp regression.

[call]
target_function = "consume"
parameter_names = ["value"]
per_element = false
ref_declarations = {item = "[1, 2]"}
consumable_refs = ["item"]
unknown_ref_names = ["item"]
explicit_ref_value_sources = {}

# Retain empty bindings and statement-only calls under explicit result annotations and alternate layouts.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
