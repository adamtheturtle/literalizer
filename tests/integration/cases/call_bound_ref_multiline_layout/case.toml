schema_version = 1
owner = "literalize-call"

[call]
target_function = "f"
parameter_names = ["value"]
per_element = false
collection_layout = "multiline"
languages = ["Haskell", "Python"]
languages_reason = "Haskell layout requires each multiline call to have a single do-block bind; Python is a representative for multiline bound-ref layout."

[call.ref_declarations]
x = "[[1, 2], [3, 4]]"
