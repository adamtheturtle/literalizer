language = "PureScript"
input_format = "json"
opener = "["
closer = "]"
depth = 400
payload = "1"

consumer_template = '''module Check where
import Prelude ((-))
import Partial.Unsafe (unsafeCrashWith)
{preamble}
{body_preamble}
value :: Val
value = {code}

verify :: Int -> Val -> Int
verify 0 (PInt 1) = 1
verify depth (PList [child]) = verify (depth - 1) child
verify _ _ = unsafeCrashWith "incorrect deep input shape or value"

checked :: Int
checked = verify {depth} value
'''
