schema_version = 1
owner = "literalize-ref-default"

[ref]
variant_only = true
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_zig_external_json_declaration.
variable_form = "new"
external_declarations = {shared = "[1, 2]"}
explicit_ref_value_sources = {shared = "[1, 2]"}

[ref.consumer]
target_function = "consume_widget"

[[ref.variants]]
axis = "json_type"
