schema_version = 1
owner = "literalize-ref-default"

[ref]
variant_only = true
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_zig_external_json_assignment.
variable_form = "existing"
external_declarations = {shared = "[1, 2]", my_data = "[0]"}
explicit_ref_value_sources = {shared = "[1, 2]"}

[ref.consumer]
target_function = "consume_widget"
before_assignment = true

[[ref.variants]]
axis = "json_type"
