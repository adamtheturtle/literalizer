schema_version = 1
owner = "native-invocation"
gates = [{kind = "capability_flag", flag = "supports_native_invocations"}]

# Preserve the original native batch metadata regression with executable values.
[native_invocation]
consumer_template = '''#import <Foundation/Foundation.h>
static NSMutableArray *received(void) {{
  static NSMutableArray *values = nil;
  if (values == nil) {{
    values = [NSMutableArray array];
  }}
  return values;
}}
static void consume(id value) {{
  [received() addObject:value];
}}
int main(void) {{
  @autoreleasepool {{
{code}
    NSArray *expected = @[ @"first", @42 ];
    NSCAssert([received() isEqualToArray:expected],
              @"selected native values changed");
  }}
  return 0;
}}
'''
