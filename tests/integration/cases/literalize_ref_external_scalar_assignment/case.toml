schema_version = 1
owner = "literalize-ref-default"

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Mutable backends execute the assignment; immutable scaffolds must refuse it.
variable_form = "existing"
explicit_ref_value_sources = {shared = "1"}

[ref.context]
kind = "external"
declarations = {my_data = "0", shared = "1"}

[ref.context.consumer]
kind = "value-check"
expected_source = "1"
