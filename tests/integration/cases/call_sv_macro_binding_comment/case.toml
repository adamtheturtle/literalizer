# Regression provenance: SystemVerilog. SystemVerilog macro backticks do not open D raw strings or hide trailing line comments.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_identifier_prefix", prefix = "`"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "(`__LINE__ > 0) ? {call} : {call} // trailing `marker"
wrap_in_file = true
variable_form = "new"
