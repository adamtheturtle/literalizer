schema_version = 1
owner = "literalize-call"

[call]
# Original regression (call_csharp_json_repeated_object): JsonNode references require independent parent ownership.
target_function = "consume"
parameter_names = ["value"]
per_element = false
requires_inline_multiline_dict_args = true
wrap_in_file = true
ref_declarations = { shared = '{"value": [1, 2]}' }
variant_only = true

[[call.variants]]
axis = "json_type"
