schema_version = 1
owner = "literalize-call"

# Consolidates original regressions: call_binding_existing_comment_multiple_d, call_binding_existing_comment_multiple_systemverilog.
[call]
integer_receiver_events = [["result", 42], ["call", 42], ["result", 142]]
gates = [{kind = "capability_flag", flag = "declares_call_styles"}, {kind = "enum_member_present", option = "comment_format", member = "DOUBLE_SLASH"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "existing"

[[call.variants]]
axis = "type_hints"

[call.transform]
kind = "template"
template = "{call} // note\n// extra"

[call.fixture]
kind = "composed"

[call.fixture.ref_declarations]
my_data = "42"

[call.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume_widget"
