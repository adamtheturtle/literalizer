expected_calls = 1
source = '[["user_1", 100.0]]'
zip_source = '[[true, "first"]]'
pre_indent_level = 0
consumer_template = '''{preamble}
from typing import List, Tuple
class Counter:
    def __init__(self) -> None:
        self.seen: List[Tuple[str, float]] = []
    def accept(self, user: str, timestamp: float, /) -> bool:
        self.seen.append((user, timestamp))
        return user == "user_1"
counter = Counter()
reasons: List[str] = []
def check_result(actual: bool, expected: Tuple[bool, str], /) -> None:
    assert actual is expected[0]
    reasons.append(expected[1])
{code}
assert counter.seen == [('user_1', 100.0)]
assert reasons == ['first']
'''

