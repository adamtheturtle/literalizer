schema_version = 1
owner = "variant"

[[variants]]
axis = "float_format"

# Check extreme and subnormal floating values in explicitly typed and alternate native containers.

[variants.consumer_templates]
Python = '''{code}
# Independent native value checks.
import struct
assert all(type(value) is float for value in my_data)
assert [struct.pack("!d", value).hex() for value in my_data] == ['0000000000000001', '8000000000000001', '0010000000000000']
'''
Ruby = '''{code}
# Independent native value checks.
raise "float type changed" unless my_data.all? {{ |value| value.instance_of?(Float) }}
raise "float precision or sign changed" unless my_data.map {{ |value| [value].pack("G").unpack1("H*") }} == ["0000000000000001", "8000000000000001", "0010000000000000"]
'''
[[variants]]
axis = "type_hints"

[[variants]]
axis = "sequence"

[[variants]]
axis = "numeric_separator"
