[[variants]]
axis = "datetime_swift"
wrap_in_file = false

[variants.consumer_templates]
Swift = '''{preamble}
{code}
let expected: [Int64] = [981173106123456, 981173105123456, 981173107123456, 981173106123455, 981173106123457, 981173105623456, 981173106623456, 981153291123455, 981192921123457, 981086706123457, 981259506123455]
for (stamp, instant) in zip(my_data["stamps"]!, expected) {{
    let actual = Int64((stamp.timeIntervalSince1970 * 1_000_000).rounded())
    precondition(actual == instant, "UTC instant changed")
}}
'''

