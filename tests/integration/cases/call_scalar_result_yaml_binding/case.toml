# Shared input and API context; named examples preserve specialized regression witnesses.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
wrap_in_file = true
variable_form = "new"

[[call_examples]]
# Regression provenance: call_regex_interpolated_regex_binding
# Regression provenance: Haxe; Haxe EReg literal delimiters retain their escaped slashes during call binding.
example = "call_regex_interpolated_regex_binding"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "(~/\\//).match(\"/\") ? {call} : null"
wrap_in_file = true
variable_form = "new"

[[call_examples.gates]]
kind = "call_literal_flag"
flag = "regex_literals"

[[call_examples.gates]]
kind = "call_interpolation"
opener = "${"
quotes = "'"

[[call_examples]]
# Regression provenance: call_regex_interpolated_regex_binding_comment
# Regression provenance: Haxe; Haxe regex slashes stay inside the expression while its trailing comment follows the terminator.
example = "call_regex_interpolated_regex_binding_comment"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "(~/\\//).match(\"/\") ? {call} : null // trailing"
wrap_in_file = true
variable_form = "new"

[[call_examples.gates]]
kind = "call_literal_flag"
flag = "regex_literals"

[[call_examples.gates]]
kind = "call_interpolation"
opener = "${"
quotes = "'"

[[call_examples]]
# Regression provenance: call_sv_macro_binding_comment
# Regression provenance: SystemVerilog. SystemVerilog macro backticks do not open D raw strings or hide trailing line comments.
example = "call_sv_macro_binding_comment"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "(`__LINE__ > 0) ? {call} : {call} // trailing `marker"
wrap_in_file = true
variable_form = "new"

[[call_examples.gates]]
kind = "call_identifier_prefix"
prefix = "`"
