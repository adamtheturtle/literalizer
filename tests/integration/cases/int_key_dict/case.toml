schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "declaration_style"

[[variants]]
axis = "dict_decl"

[[variants]]
axis = "heterogeneous_strategy"

[[variants]]
axis = "language_version"

[[variants]]
axis = "integer_format"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
assert all(type(key) is int for key in my_data)
assert my_data == {{1: 'one', 2: 'two', 42: 'answer'}}
'''
Ruby = '''{code}
# Independent native value checks.
raise "mapping keys or values changed" unless my_data == {{1 => "one", 2 => "two", 42 => "answer"}}
raise "mapping key type changed" unless my_data.keys.all? {{ |key| key.instance_of?(Integer) }}
'''
