schema_version = 1
owner = "literalize-ref-default"

# Exact native offsets retain cancellation and UTC boundary behavior
# (#6582). Microseconds are explicit to avoid ISO parser differences.
[ref]
variable_name = "result_data"
variant_only = true

[ref.bound_ref_datetimes]
positive_second = {wall_time = 1970-01-01T00:00:00.000000, offset_microseconds = 1000000}
negative_second = {wall_time = 1970-01-01T00:00:00.000000, offset_microseconds = -1000000}
microsecond = {wall_time = 1970-01-01T00:00:00.000001, offset_microseconds = 1}
millisecond = {wall_time = 1970-01-01T00:00:00.001000, offset_microseconds = 1000}
carry = {wall_time = 1970-01-01T00:00:00.999999, offset_microseconds = -1}
fraction = {wall_time = 1970-01-01T00:00:00.123456, offset_microseconds = 123456}
one_millisecond = {wall_time = 1970-01-01T00:00:00.123456, offset_microseconds = 122456}
calendar_boundary = {wall_time = 0001-01-01T00:00:00.000000, offset_microseconds = 1000000}
utc = 1970-01-01T00:00:00Z

[[ref.variants]]
axis = "datetime_javascript"
