# Regression provenance: prefixed_identifier_inside_incomplete_expression.
# A macro identifier before an operator does not hide the final line comment.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_identifier_prefix", prefix = "`"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"

[call.transform]
kind = "template"
template = '''(`__LINE__ + 1 > 0) ? {call} : {call} // note'''

[call.fixture]
kind = "composed"

[call.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
[[call_examples]]
example = "existing"
gates = [{kind = "call_identifier_prefix", prefix = "`"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "existing"

[call_examples.transform]
kind = "template"
template = '''(`__LINE__ + 1 > 0) ? {call} : {call} // note'''

[call_examples.fixture]
kind = "composed"
ref_declarations = {my_data = "42"}

[call_examples.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
