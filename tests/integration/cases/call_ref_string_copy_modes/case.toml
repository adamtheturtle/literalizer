schema_version = 1
owner = "literalize-call"

[call]
target_function = "consume"
parameter_names = ["value"]
per_element = true
ref_declarations = { item = '"s"' }
consumable_refs = ["item"]

[[call.variants]]
axis = "json_type"

# Preserve escaped and reused string bindings in complete annotated and alternate-layout call consumers.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
