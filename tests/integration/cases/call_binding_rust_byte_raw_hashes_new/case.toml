# Regression provenance: Rust. Rust raw and byte-raw string delimiters may contain quoted comment markers.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_hash_raw_prefix", prefix = "br", marker = "#"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
call_transform = '''
make_widget(br#"// payload"#) // note'''
followup_source = '{"$ref": "my_data"}'
followup_target_function = "consume"
