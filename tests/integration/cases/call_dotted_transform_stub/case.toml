schema_version = 1
owner = "literalize-call"

[call]
target_function = "process"
parameter_names = ["value"]
per_element = true
call_transform = "tracer.emit({call})"
transform_stub_names = ["tracer.emit"]
requires_call_returns_expression = true

[[call.variants]]
axis = "heterogeneous_strategy"

# Compile the shared call in annotation and collection-layout contexts.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
