# Regression provenance: CSharp; The target language preserves its quoted string syntax when terminating transformed call bindings.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_literal_flag", flag = "verbatim_strings"}, {kind = "call_interpolation", opener = "{", quotes = '"'}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = "$\"{{$\"{{1://}}\"}}\" // trailing\n// extra"
wrap_in_file = true
variable_form = "new"
