schema_version = 1
owner = "literalize-ref"

[ref]
languages = ["Python", "Swift"]
languages_reason = "Native record bindings retain their generated types in explicit annotations, including nullable fields."
heterogeneous_strategy = "RECORD"
variable_type_hints = "ALWAYS"

[ref.value_sources]
nullable = '{"x":1,"y":null}'
null_fields = '{"x":null,"y":null}'
plain = '{"x":1,"y":2}'
