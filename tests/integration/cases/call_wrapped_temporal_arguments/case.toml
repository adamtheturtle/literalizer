schema_version = 1
owner = "literalize-call"

# The argument values need a preamble import, which the wrapped file
# assembles alongside the target-function stub.
[call]
# Shared coverage retains call_wrap_in_file_temporal.
target_function = "check"
parameter_names = ["ts", "d"]
per_element = true
wrap_in_file = true

[[call.variants]]
axis = "sequence"
