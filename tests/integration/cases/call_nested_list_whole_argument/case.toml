schema_version = 1
owner = "literalize-call"

[call]
target_function = "f"
parameter_names = ["a"]
per_element = false
wrap_in_file = true

# Keep a whole collection as one typed call argument across empty, populated and nested inputs and layout modes.
[[call.variants]]
axis = "sequence"

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"

# Explicit case choices override both members of the layout axis. The
# original call above leaves the choice omitted and inherits each member.
[[call_examples]]
example = "layout_forced_compact"
target_function = "f"
parameter_names = ["a"]
per_element = false
wrap_in_file = true
variant_only = true
collection_layout = "compact"

[[call_examples.variants]]
axis = "collection_layout"

[[call_examples]]
example = "layout_forced_multiline"
target_function = "f"
parameter_names = ["a"]
per_element = false
wrap_in_file = true
variant_only = true
collection_layout = "multiline"

[[call_examples.variants]]
axis = "collection_layout"
