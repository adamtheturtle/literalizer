# Native wrapper helpers retain class, file, and body declaration scopes.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "process"
parameter_names = ["value"]
per_element = false
zip_source = "42"
zip_input_format = "yaml"

[call.transform]
kind = "wrapper"
target = "helpers.emit"
outer = "{call}"

[[call.transform.arguments]]
role = "call"
parameter = "_call"

[[call.transform.arguments]]
role = "zipped"
parameter = "_zip"
[call.fixture]
kind = "wrapped"
