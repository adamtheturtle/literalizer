schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "collection_layout"

[[variants]]
axis = "dict_format"

[[variants]]
axis = "json_type"

[[variants]]
axis = "type_hints"

[[variants]]
axis = "bool_format"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
assert all(type(key) is bool for key in my_data)
assert my_data == {{True: 'yes', False: 'no'}}
'''
Ruby = '''{code}
# Independent native value checks.
raise "mapping keys or values changed" unless my_data == {{true => "yes", false => "no"}}
'''
