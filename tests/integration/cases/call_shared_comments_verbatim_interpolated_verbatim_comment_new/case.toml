# Regression provenance: CSharp; The transformed call uses CSharp literal and comment syntax.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_literal_flag", flag = "verbatim_strings"}, {kind = "call_interpolation", opener = "{", quotes = '"'}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
wrap_in_file = true
variable_form = "new"
call_transform = "(@\"ends\\\" + \"// payload\").Length >= 0 ? {call} : {call} // trailing\n// extra"
