schema_version = 1
owner = "literalize-call"

# Compose grouped calls with outer templates using native integer
# expressions. Zip data must reach either template that consumes it.
[call]
gates = [{kind = "integer_call_stub"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "new"
zip_source = "3"
zip_input_format = "json"

[call.transform]
kind = "group"
body = "{call}"
outer = "({call} + 1) * {zipped}"

[call.fixture]
kind = "wrapped"
[[call_examples]]
example = "body_zip"
gates = [{kind = "integer_call_stub"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "new"
zip_source = "3"
zip_input_format = "json"

[call_examples.transform]
kind = "group"
body = "{call} * {zipped}"
outer = "({call} + 1) * 2"

[call_examples.fixture]
kind = "wrapped"
[[call_examples]]
example = "no_zip"
gates = [{kind = "integer_call_stub"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "new"

[call_examples.transform]
kind = "group"
body = "{call}"
outer = "({call} + 1) * 2"

[call_examples.fixture]
kind = "wrapped"
[[call_examples]]
example = "outer_zip_date"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "new"
zip_source = "2024-01-15"
zip_input_format = "yaml"

[[call_examples.gates]]
kind = "call_hash_raw_prefix"
prefix = "r"
marker = "#"

[call_examples.transform]
kind = "group"
body = "wrap_widget({call}, r#\"// group\"#)"
outer = "zip_widget({call}, {zipped})"
stub_names = ["wrap_widget", "zip_widget"]
stub_param_names = ["value", "extra"]

[call_examples.fixture]
kind = "composed"

[call_examples.fixture.followup]
source = "{\"$ref\": \"my_data\"}"
target_function = "consume"
[[call_examples]]
