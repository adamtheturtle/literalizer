schema_version = 1
suites = ["base", "combined"]
strict_golden_outcomes = true

[[variants]]
axis = "json_type"
suffix = "_float_specials"

[[variants]]
axis = "float_format"
suffix = "_v"

[[variants]]
axis = "numeric_literal_suffix"
suffix = "_float_v"

[[variants]]
axis = "numeric_separator"
suffix = "_float_v"

[[variants]]
axis = "type_name"
suffix = "_v"

[[variants]]
axis = "constructor_prefix"
suffix = "_v"

[[variants]]
axis = "numeric_style"

[[variants]]
axis = "language_version"

[[variants]]
axis = "sequence"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
import math
assert isinstance(my_data, (list, tuple))
assert all(type(value) is float for value in my_data)
assert len(my_data) == 3
assert math.isinf(my_data[0]) and my_data[0] > 0
assert math.isinf(my_data[1]) and my_data[1] < 0
assert math.isnan(my_data[2])
'''
Ruby = '''{code}
# Independent native value checks.
raise "special float types changed" unless my_data.size == 3 && my_data.all? {{ |value| value.instance_of?(Float) }}
raise "special float classes changed" unless my_data[0].infinite? == 1 && my_data[1].infinite? == -1 && my_data[2].nan?
'''
