schema_version = 1
owner = "literalize-call"

# ``unknown_value`` is declared so every emitted fixture is
# self-contained, but omitted from ``ref_values`` so the call receives
# ``None`` for that mapping.  Haskell must strip the top-level marker
# before preamble inference; retaining it would visibly add HStr/HMap
# to the generated Val declaration.  Gleam must still add GInt for the
# declaration-only integer below.
[call]
target_function = "process"
parameter_names = ["data"]
per_element = false
ref_declarations = { unknown_value = "[1]" }
unknown_ref_names = ["unknown_value"]
