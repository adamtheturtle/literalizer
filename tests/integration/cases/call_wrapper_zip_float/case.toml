# Native wrapper parameters retain the actual emitted float representation.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "process"
parameter_names = ["value"]
per_element = false
zip_source = "1.5"
zip_input_format = "yaml"

# Check zipped scalar, mapping, and wrapper operands against generated helper signatures across call options.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"

[call.transform]
kind = "wrapper"
target = "emit"

[[call.transform.arguments]]
role = "call"
parameter = "_call"

[[call.transform.arguments]]
role = "zipped"
parameter = "_zip"
