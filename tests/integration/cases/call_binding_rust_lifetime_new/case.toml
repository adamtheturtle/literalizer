schema_version = 1
owner = "literalize-call"

[call]
languages = ["Rust"]
languages_reason = "Rust lifetime arguments must not be mistaken for quoted characters."
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
call_transform = '''
{{
    {call};
    {{
        fn make_widget<'a>() where 'a: 'a {{}}
        make_widget::<'static>()
    }}
}} // note'''
followup_source = '{"$ref": "my_data"}'
followup_target_function = "consume"
