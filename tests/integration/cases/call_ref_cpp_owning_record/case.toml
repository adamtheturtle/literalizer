schema_version = 1
owner = "literalize-call"

[call]
languages = ["Cpp", "C"]
languages_reason = "Native record references with string fields retain their generated struct type at call sites."
target_function = "consume"
parameter_names = ["value"]
per_element = true
variant_only = true
ref_declarations = { item = '{"value":"owned"}' }
consumable_refs = ["item"]

[[call.variants]]
axis = "heterogeneous_strategy_record"
