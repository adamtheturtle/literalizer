schema_version = 1
owner = "literalize-call"
# Regression provenance: Dart, Kotlin.
# Explicit literal hints must not become annotations of an unknown call result.

[call]
gates = [{kind = "capability_flag", flag = "declares_call_styles"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
wrap_in_file = true
variable_form = "new"

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "call_result_var_type_hints_always"
