schema_version = 1
owner = "literalize-call"

# Exercise the standard library in OCaml and an aliased, generated
# target module in PureScript.
[call]
gates = [{kind = "enum_member_present", option = "date_format", member = "OCAML"}]
target_function = "stdlib.ignore"
parameter_names = ["a"]
per_element = true

[call.fixture]
kind = "composed"
include_target_stub = false

[[call_examples]]
example = "import_alias"
target_function = "Target.consume"
parameter_names = ["a"]
per_element = true

variant_only = true

[[call_examples.variants]]
axis = "qualified_import_call"

[call_examples.fixture]
kind = "composed"
include_target_stub = false
