schema_version = 1
owner = "literalize-call"

# Exercise qualified calls against the standard library in OCaml and a
# caller-supplied module alias in PureScript.
[call]
gates = [{kind = "enum_member_present", option = "date_format", member = "OCAML"}]
target_function = "stdlib.ignore"
parameter_names = ["a"]
per_element = true

[call.fixture]
kind = "composed"
include_target_stub = false

[[call_examples]]
example = "import_alias"
gates = [{kind = "enum_member_present", option = "language_version", member = "V0_15"}]
target_function = "Module.func"
parameter_names = ["a"]
per_element = true

# Public composition places the caller-owned import before the call.
[call_examples.fixture]
kind = "composed"
include_target_stub = false
caller_imports = ["import LiteralizerSupport.CallTarget as Module"]
