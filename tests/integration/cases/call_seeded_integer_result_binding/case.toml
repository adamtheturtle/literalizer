# Shared input and API context; named examples preserve specialized regression witnesses.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "existing"

[call.fixture]
kind = "composed"

[call.fixture.ref_declarations]
my_data = "42"

[call.fixture.followup]
source = "{\"$ref\": \"my_data\"}"
target_function = "consume"

[[call_examples]]
# Regression provenance: call_shared_comments_regex_interpolated_existing_regex_comment_existing
# Regression provenance: Haxe; The transformed call uses Haxe literal and comment syntax.
example = "call_shared_comments_regex_interpolated_existing_regex_comment_existing"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
variable_form = "existing"
variant_only = true

[[call_examples.gates]]
kind = "call_literal_flag"
flag = "regex_literals"

[[call_examples.gates]]
kind = "call_interpolation"
opener = "${"
quotes = "'"

[[call_examples.variants]]
axis = "declaration_style"

# Keep existing integer and nullable result bindings valid when their values are passed to a later call.

[call_examples.transform]
kind = "template"
template = "(~/\\//).match(\"/\") ? {call} : null // trailing"

[call_examples.fixture]
kind = "composed"

[call_examples.fixture.ref_declarations]
my_data = "42"

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
