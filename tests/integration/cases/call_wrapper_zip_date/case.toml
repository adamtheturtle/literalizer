# Native wrapper parameters retain the actual emitted date representation.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "process"
parameter_names = ["value"]
per_element = false
zip_source = "2024-01-15"
zip_input_format = "yaml"

[call.transform]
kind = "wrapper"
target = "emit"

[[call.transform.arguments]]
role = "call"
parameter = "_call"

[[call.transform.arguments]]
role = "zipped"
parameter = "_zip"
