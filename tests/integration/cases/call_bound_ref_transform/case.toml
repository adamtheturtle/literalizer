# Regression provenance: Python. Python's built-in repr consumes the transformed call's return value.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "f"
parameter_names = ["a"]
per_element = true

[call.transform]
kind = "wrapper"
target = "repr"

[[call.transform.arguments]]
role = "call"
parameter = "_arg"
[call.fixture]
kind = "wrapped"

[call.fixture.ref_declarations]
ref_data = "1"
