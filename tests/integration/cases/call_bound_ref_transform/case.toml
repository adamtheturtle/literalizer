# Regression provenance: Python. Python's built-in repr consumes the transformed call's return value.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "f"
parameter_names = ["a"]
per_element = true
call_transform_wrapper = {target = "repr", arguments = ["call"]}
transform_stub_names = ["repr"]
wrap_in_file = true

[call.ref_declarations]
ref_data = "1"
