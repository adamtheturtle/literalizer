schema_version = 1
owner = "literalize-call"

# Retain declaration helpers when composing calls with or without inference
# hints (#6581, #6583, #6584). Explicit hints exercise the manual composer,
# rather than the bound-reference wrapper.
[call]
target_function = "consume"
parameter_names = ["value"]
per_element = false
variant_only = true
ref_declarations = { item = '{"name":"first","values":[1,2]}' }
explicit_ref_value_sources = { item = '{"name":"first","values":[1,2]}' }

[[call.variants]]
axis = "heterogeneous_strategy_record"
