schema_version = 1
owner = "literalize-ref-default"

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_rust_unresolved_unrelated_values.
# Compose the caller's declaration after rendering so a remains unresolved
# during public API inference, while the resulting fixture compiles.
explicit_ref_value_sources = {zzz = "5"}

[ref.context]
kind = "external"
declarations = {a = "0"}

[ref.context.consumer]
kind = "value-check"
expected_source = "[0, 1]"
