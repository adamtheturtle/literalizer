schema_version = 1
owner = "literalize-call"

[call]
languages = ["Haxe"]
languages_reason = "The transformed call uses Haxe literal and comment syntax."
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
wrap_in_file = true
variable_form = "new"
call_transform = "(~/\\//).match(\"/\") ? {call} : null // trailing"
