# Regression provenance: prefix_without_identifier.
# An escaped identifier may contain a backtick followed by a non-identifier character.
schema_version = 1
golden_layout = "nested"
owner = "literalize-call"

[call]
gates = [{kind = "call_identifier_prefix", prefix = "`"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"

[call.transform]
kind = "template"
template = '''(\`+ .i == 1) ? {call} : {call} // note'''

[call.fixture]
kind = "composed"
ref_declarations = {'\`+ ' = "1"}

[call.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"

[[call_examples]]
example = "existing"
gates = [{kind = "call_identifier_prefix", prefix = "`"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "existing"

[call_examples.transform]
kind = "template"
template = '''(\`+ .i == 1) ? {call} : {call} // note'''

[call_examples.fixture]
kind = "composed"
ref_declarations = {'\`+ ' = "1", my_data = "42"}

[call_examples.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
