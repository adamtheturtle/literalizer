schema_version = 1
golden_layout = "nested"
owner = "literalize-ref-default"

[ref]
variant_only = true
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_odin_json_existing_binding.
variable_form = "existing"

[[ref.variants]]
axis = "json_type"

[ref.context]
kind = "external"
declarations = {my_data = '{"a": 0}'}

[ref.context.consumer]
kind = "assignment"
target_function = "consume_widget"
