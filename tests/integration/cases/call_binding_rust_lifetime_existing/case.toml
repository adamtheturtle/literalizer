# Regression provenance: Rust. Rust lifetime arguments must not be mistaken for quoted characters.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_character_quote", quote = "'"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "existing"
call_transform = '''
{{
    {call};
    {{
        fn make_widget<'a>() where 'a: 'a {{}}
        make_widget::<'static>()
    }}
}} // note'''
ref_declarations = {my_data = "42"}
followup_source = '{"$ref": "my_data"}'
followup_target_function = "consume"
