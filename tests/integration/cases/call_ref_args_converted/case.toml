schema_version = 1
owner = "literalize-call"

[call]
target_function = "process"
parameter_names = ["data", "count"]
per_element = true
ref_case_per_language = true
consumable_refs = ["my_other", "my_var"]

# Keep converted reference names, argument types, and whole-value ownership consistent across call options.
[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"

[call.fixture]
kind = "bound"
ref_declarations = { my_var = "[1, 2, 3]", my_other = "[4, 5, 6]" }
