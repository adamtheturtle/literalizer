# Regression provenance: Haxe; Haxe EReg literal delimiters retain their escaped slashes during call binding.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_literal_flag", flag = "regex_literals"}, {kind = "call_interpolation", opener = "${", quotes = "'"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = '(~/\//).match("/") ? {call} : null'
wrap_in_file = true
variable_form = "new"
