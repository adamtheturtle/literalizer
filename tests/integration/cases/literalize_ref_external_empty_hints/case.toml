schema_version = 1
owner = "literalize-ref-default"

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_cpp_external_empty.
variable_form = "existing"
explicit_ref_value_sources = {}

[ref.context]
kind = "external"
declarations = {item = "[1, 2]", my_data = "[1, 2]"}

[ref.context.consumer]
kind = "assignment"
target_function = "consume_widget"
