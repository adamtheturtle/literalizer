# A collection-valued condition keeps comments and nullable branches in scope.
schema_version = 1
owner = "literalize-call"

[call]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform_nullable_conditional = true
wrap_in_file = true
variable_form = "new"
gates = [{kind = "nullable_object_call_stub"}]
call_transform = "{call}"
[[call_examples]]
example = "nested"
variable_form = "new"
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform_nullable_conditional = true
wrap_in_file = true
gates = [{kind = "nullable_object_call_stub"}]
call_transform = "(\n{call}\n)"
