# Native wrapper parameters retain the actual emitted integer representation.
schema_version = 1
owner = "literalize-call"

[call]
integer_receiver_events = [["call", 1], ["result", 101], ["zipped", 42]]
target_function = "process"
parameter_names = ["value"]
per_element = false
zip_source = "42"
zip_input_format = "yaml"

[call.transform]
kind = "wrapper"
target = "emit"

[[call.transform.arguments]]
role = "call"
parameter = "_call"

[[call.transform.arguments]]
role = "zipped"
parameter = "_zip"
