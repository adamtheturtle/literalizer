# Regression provenance: Haxe; Haxe regex slashes stay inside the expression while its trailing comment follows the terminator.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_literal_flag", flag = "regex_literals"}, {kind = "call_interpolation", opener = "${", quotes = "'"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
call_transform = '(~/\//).match("/") ? {call} : null // trailing'
wrap_in_file = true
variable_form = "new"
