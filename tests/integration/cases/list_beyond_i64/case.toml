schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "json_type"
suffix = "_list_beyond_i64"

[[variants]]
axis = "language_version"

[[variants]]
axis = "json_rendering"
suffix = "_list_beyond_i64"

[[variants]]
axis = "numeric_separator"

[[variants]]
axis = "type_hints"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
assert isinstance(my_data, (list, tuple))
assert all(type(value) is int for value in my_data)
assert tuple(my_data) == (9223372036854775807, 9223372036854775808)
'''
Ruby = '''{code}
# Independent native value checks.
raise "integer type changed" unless my_data.all? {{ |value| value.instance_of?(Integer) }}
raise "integer value changed" unless my_data == [9223372036854775807, 9223372036854775808]
'''
