schema_version = 1
owner = "literalize-call"
# Positive counterpart of call_parameter_count_mismatch (#5236).
# Scheme's original (lambda args ...) stub accepts rest arguments.
# Select every producer that supports calls with variable arity.

[call]
gates = [{ kind = "capability_flag", flag = "supports_variadic_calls" }]
target_function = "process"
parameter_names = ["a", "b"]
per_element = true
wrap_in_file = true
