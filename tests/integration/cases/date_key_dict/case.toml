schema_version = 1
suites = ["base", "combined"]

[[variants]]
axis = "collection_layout"

[base_context.consumer_templates]
Python = '''{code}
# Independent native value checks.
import datetime as expected_datetime
assert all(type(key) is expected_datetime.date for key in my_data)
assert {{key.isoformat(): value for key, value in my_data.items()}} == {{"2024-01-01": "new_year", "2024-07-04": "independence_day", "2024-12-25": "christmas"}}
'''
Ruby = '''{code}
# Independent native value checks.
raise "date key type changed" unless my_data.keys.all? {{ |key| key.instance_of?(Date) }}
raise "date keys changed" unless my_data.map {{ |key, value| [key.iso8601, value] }}.to_h == {{"2024-01-01" => "new_year", "2024-07-04" => "independence_day", "2024-12-25" => "christmas"}}
'''
