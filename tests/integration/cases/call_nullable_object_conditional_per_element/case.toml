# A result binding requires exactly one generated call, including per-element mode.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "nullable_object_call_stub"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = true
variable_form = "new"

[[call.variants]]
axis = "type_hints"

[call.transform]
kind = "nullable-conditional"

[call.fixture]
kind = "wrapped"
