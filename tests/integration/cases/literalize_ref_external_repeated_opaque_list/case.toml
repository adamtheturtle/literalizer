# Caller declarations are composed after rendering; the API receives no value hints.
schema_version = 1
owner = "literalize-ref-default"
input = "input.json"

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
explicit_ref_value_sources = {}

[ref.context]
kind = "external"
declarations = {item = "[]"}

[ref.context.consumer]
kind = "value-check"
expected_source = "[[], []]"
