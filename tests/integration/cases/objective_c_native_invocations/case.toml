schema_version = 1
owner = "native-invocation"
gates = [{kind = "capability_flag", flag = "supports_native_invocations"}]

[native_invocation]
consumer_template = '''#import <Foundation/Foundation.h>
@interface NativeCounter : NSObject {{
  NSInteger _count;
}}
- (instancetype)initWithCount:(NSInteger)count;
- (BOOL)accept:(NSString *)userId timestamp:(double)timestamp;
- (void)reset;
- (NSInteger)count;
+ (NSString *)label;
@end
@implementation NativeCounter
- (instancetype)initWithCount:(NSInteger)count {{
  self = [super init];
  if (self) {{
    _count = count;
  }}
  return self;
}}
- (BOOL)accept:(NSString *)userId timestamp:(double)timestamp {{
  _count++;
  return [userId isEqualToString:@"user_1"] && timestamp == 100.0;
}}
- (void)reset {{
  _count = 0;
}}
- (NSInteger)count {{
  return _count;
}}
+ (NSString *)label {{
  return @"native";
}}
@end
static void verifyResult(BOOL actual, NSArray *expected) {{
  NSCAssert(actual == [expected[0] boolValue], @"wrong selector result");
}}
static void verifyObject(NSNumber *actual) {{
  NSCAssert([actual boolValue], @"scalar call result must be boxed");
}}
static void verifyBoxes(NSNumber *number, NSNumber *flag) {{
  NSCAssert([number integerValue] == 42 && [flag boolValue],
            @"object arguments must be boxed");
}}
static NSArray<NSString *> *makeNames(void) {{
  return @[ @"native" ];
}}
static void verifyNull(id value) {{
  NSCAssert(value == [NSNull null], @"null changed");
}}
static void verifyBool(BOOL value) {{
  NSCAssert(value, @"bool must stay scalar");
}}
static void verifyScalar(NSInteger value) {{
  NSCAssert(value == 42, @"integer changed");
}}
static void verifyDouble(double value) {{
  NSCAssert(value == 3.0, @"numeric widening changed");
}}
static void verifyLabel(NSString *value) {{
  NSCAssert([value isEqualToString:@"native"], @"id reference changed");
}}
static void
verifyDictionary(NSDictionary<NSString *, NSArray<NSString *> *> *value) {{
  NSCAssert([value[@"group"][0] isEqualToString:@"native"],
            @"generic values changed");
}}
int main(void) {{
  @autoreleasepool {{
{code}
    [mutableNames addObject:@"second"];
    NSCAssert(mutableNames.count == 2, @"literal receiver lost mutability");
    NSCAssert(!allowed, @"reassignment must call the original receiver");
    NSCAssert([label isEqualToString:@"native"], @"class message changed");
    NSCAssert(finalCount == 0 && nestedCount == 3,
              @"constructor or reset changed");
    NSCAssert([names[0] isEqualToString:@"native"], @"generic binding changed");
  }}
  return 0;
}}
'''
