schema_version = 1
owner = "literalize-call"

# Mix of register-trivial (Int / Bool / Float64) and non-trivial (List)
# consumable refs.  Each ref is single-use, so without the
# consume-suppression hook every ref would be eligible for the
# consuming form.  The Mojo ``^`` is a hard error under ``--Werror``
# for register-trivial scalars, so the trivial refs must emit as bare
# identifiers while ``my_list`` keeps ``^``.  Other languages that move
# consumable refs (notably C++) still render the consuming form for
# every ref.
[call]
target_function = "process"
parameter_names = ["value", "count"]
per_element = true
ref_declarations = { my_int = "1", my_bool = "true", my_float = "3.14", my_list = "[1, 2, 3]" }
consumable_refs = ["my_bool", "my_float", "my_int", "my_list"]
