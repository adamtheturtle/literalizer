schema_version = 1
owner = "literalize-ref-default"

[ref]
variant_only = true
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]
# Shared coverage retains literalize_ref_cpp_external_json_null.
variable_form = "existing"
explicit_ref_value_sources = {item = "null"}

[[ref.variants]]
axis = "json_type"

[ref.context]
kind = "external"
declarations = {item = "null", my_data = "null"}

[ref.context.consumer]
kind = "assignment"
target_function = "consume_widget"
