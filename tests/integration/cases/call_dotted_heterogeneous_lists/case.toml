schema_version = 1
owner = "literalize-call"

[call]
languages = ["V"]
languages_reason = "V's pinned compiler rejects variadic method stubs for interface-backed lists even without empty arguments; the nested target covers void method stubs alongside the mixed-empty case's value-returning methods."
target_function = "app.client.go"
parameter_names = ["first_value", "second_value"]
per_element = true
wrap_in_file = true

[[call.variants]]
axis = "heterogeneous_strategy"
