schema_version = 1
owner = "literalize-ref-default"

[ref]
languages = ["Zig"]
languages_reason = "Zig external references retain their expression in native and std.json.Value declarations and assignments."
variable_form = "existing"
json_type = "STD_JSON_VALUE"
external_declarations = {shared = "[1, 2]", my_data = "[0]"}
explicit_ref_value_sources = {shared = "[1, 2]"}
external_declaration_styles = {my_data = "VAR"}

[ref.consumer]
target_function = "consume_widget"
before_assignment = true
