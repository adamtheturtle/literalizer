schema_version = 1
owner = "constructor-binding"
gates = [{kind = "capability_flag", flag = "supports_bare_mapping_documents"}, {kind = "capability_flag", flag = "supports_key_value_assignment_documents", value = false}]

# Native mapping keys preserve target spelling.
# Assignment documents are owned by constructor_target_assignment_document.
[constructor]
# Literalizer owns native record/object syntax for Dhall, JSON5, Jsonnet and Nix.
target_source_template = '{{"{target}": true}}'

# Preserve the YAML block-map contract alongside the generated object literals.
[constructor.target_templates]
Yaml = '''{target}: true
'''
