'''
Hcl = '''{target} = true
'''
Json5 = '''{{ {target}: true }}
'''
Jsonnet = '''{{ {target}: true }}
'''
Nix = '''{{ {target} = true; }}
'''
Toml = '''{target} = true
'''
Yaml = '''{target}: true
'''
