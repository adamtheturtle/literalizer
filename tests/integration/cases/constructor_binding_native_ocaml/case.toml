schema_version = 1
owner = "constructor-binding"
gates = [{kind = "metadata_field", field = "language_id", value = "ocaml"}]

# Compile the target with a native one-argument constructor. The old
# zero-argument fragment did not declare a constructor or check its arity.
[constructor]
class_name = "Playlist"
parameter_names = ["value"]
variable_name = "created"
consumer_template = '''module Check = struct
{preamble}
{body_preamble}
type playlist = Playlist of val_t
{bare_code}
let () = assert (created = Playlist (OInt 1))
end
'''
