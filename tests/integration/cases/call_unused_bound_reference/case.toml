schema_version = 1
owner = "literalize-call"

[call]
target_function = "f"
parameter_names = ["value"]
per_element = false

[call.ref_declarations]
unused = "[3, 4]"

# Keep repeated and nested references usable under alternate sequence types, annotations and call layouts.
[[call.variants]]
axis = "sequence"

[[call.variants]]
axis = "type_hints"

[[call.variants]]
axis = "collection_layout"
