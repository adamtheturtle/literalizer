schema_version = 1
owner = "literalize-call"

[call]
languages = ["Go", "Python"]
languages_reason = "Go rejects unused time imports; Python exposes datetime imports across both supported versions."
target_function = "process"
parameter_names = ["value"]
per_element = false
call_transform_reports_zip_usage = false
call_transform = "emit({call}, {zipped})"
transform_stub_names = ["emit"]
transform_stub_param_names = ["_call", "_zip"]
zip_source = "2024-01-15T12:00:00"
zip_input_format = "yaml"
