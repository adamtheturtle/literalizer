schema_version = 1
owner = "literalize-call"

[call]
integer_receiver_events = [["call", 1], ["call", 2]]
target_function = "process"
parameter_names = ["value"]
per_element = true
comment_source = ["trail \\", "second"]
# A line comment ending in a backslash splices the following line
# into itself in C-family source processing and in Tcl, which
# swallows the call written there (issue #4466).
requires_standalone_wrapped_comments = true

[[call_examples]]
gates = [{kind = "capability_flag", flag = "supports_stateful_free_call_consumers"}]
example = "zipped_integer_results"
integer_receiver_events = [["call", 1], ["result", 101], ["zipped", 41], ["call", 2], ["result", 102], ["zipped", 42]]
target_function = "process"
parameter_names = ["value"]
per_element = true
call_transform_wrapper = {target = "emit", arguments = ["call", "zipped"]}
transform_stub_names = ["emit"]
transform_stub_param_names = ["_call", "_zip"]
zip_source = "[41, 42]"
zip_input_format = "json"
requires_call_returns_expression = true
