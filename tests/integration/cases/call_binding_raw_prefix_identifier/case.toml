# Regression provenance: raw_prefix_in_identifier.
# Raw string prefixes inside ordinary call identifiers do not hide a trailing comment.
schema_version = 1
golden_layout = "nested"
owner = "literalize-call"

[call]
gates = [{kind = "call_raw_string_prefix", prefix = "r"}]
target_function = "raw_value"
parameter_names = ["value"]
per_element = false
variable_form = "new"

[call.transform]
kind = "template"
template = '''{call} // note'''

[call.fixture]
kind = "composed"

[call.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
[[call_examples]]
example = "existing"
gates = [{kind = "call_raw_string_prefix", prefix = "r"}]
target_function = "raw_value"
parameter_names = ["value"]
per_element = false
variable_form = "existing"

[call_examples.transform]
kind = "template"
template = '''{call} // note'''

[call_examples.fixture]
kind = "composed"
ref_declarations = {my_data = "42"}

[call_examples.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
