schema_version = 1
owner = "literalize-call"

[call]
languages = ["Go"]
languages_reason = "Go rejects an unused time import when omitted zipped datetime text appears only inside an ordinary string argument."
target_function = "process"
parameter_names = ["value"]
per_element = true
call_transform = "{call}"
zip_source = "- 2024-01-15T12:00:00\n"
zip_input_format = "yaml"
