# Regression provenance: Rust. Rust raw identifiers must not be mistaken for raw string prefixes.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_hash_raw_prefix", prefix = "r", marker = "#"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "existing"
call_transform = '''
{{
    {call};
    fn r#type() {{}}
    r#type()
}} // note'''
ref_declarations = {my_data = "42"}
followup_source = '{"$ref": "my_data"}'
followup_target_function = "consume"
