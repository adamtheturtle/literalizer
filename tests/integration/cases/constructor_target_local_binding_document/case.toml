schema_version = 1
owner = "constructor-binding"
gates = [{kind = "capability_flag", flag = "supports_local_binding_documents"}]

# Preserve the Jsonnet local-object regression and the existing Nix binding.
# Literalizer generates local bindings from the shared empty-object input.
[constructor]
target_variable = true

# Jsonnet does not expose top-level variable declarations through literalize.
[constructor.target_templates]
Jsonnet = '''local {target} = {{}};
{target}
'''
