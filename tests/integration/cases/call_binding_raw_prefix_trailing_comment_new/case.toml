# Regression provenance: Rust. Rust raw and byte-raw string delimiters may contain quoted comment markers.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_raw_string_prefix", prefix = "r"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"

# Rust hash-delimited raw operands remain intact through the outer
# wrapper; its newline keeps the inner trailing comment scoped.
zip_source = "2024-01-15"
zip_input_format = "yaml"

[call.transform]
kind = "arguments"
arguments = ['''r"a\ // payload"''']
outer = "{call} // note"

[call.fixture]
kind = "composed"

[call.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
[[call_examples]]
example = "outer_plain"
gates = [{kind = "call_hash_raw_prefix", prefix = "r", marker = "#"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
zip_source = "2024-01-15"
zip_input_format = "yaml"

[call_examples.transform]
kind = "arguments"
arguments = ['r#"a\ // payload"#']
outer = "wrap_widget(\n    {call} // note\n)"
stub_names = ["wrap_widget"]
stub_param_names = ["value"]

[call_examples.fixture]
kind = "composed"

[call_examples.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
[[call_examples]]
example = "outer_zip"
gates = [{kind = "call_hash_raw_prefix", prefix = "r", marker = "#"}]
target_function = "make_widget"
parameter_names = ["value"]
per_element = false
variable_form = "new"
zip_source = "true"
zip_input_format = "json"

[call_examples.transform]
kind = "arguments"
arguments = ['r#"a\ // payload"#']
outer = "wrap_widget(\n    {call} // note\n    , {zipped}\n)"
stub_names = ["wrap_widget"]
stub_param_names = ["value", "zipped"]

[call_examples.fixture]
kind = "composed"

[call_examples.fixture.followup]
source = '{"$ref": "my_data"}'
target_function = "consume"
[[call_examples]]
example = "outer_zip_date"
gates = [{kind = "call_hash_raw_prefix", prefix = "r", marker = "#"}]
target_function = "make_widget"
parameter_names = ["value"]
