# Regression provenance: Haxe; The transformed call uses Haxe literal and comment syntax.
schema_version = 1
owner = "literalize-call"

[call]
gates = [{kind = "call_literal_flag", flag = "regex_literals"}, {kind = "call_interpolation", opener = "${", quotes = "'"}]
target_function = "make_widget"
parameter_names = ["count"]
per_element = false
wrap_in_file = true
variable_form = "new"
call_transform = "('prefix ${{'// payload'}}').length >= 0 ? {call} : {call}"
