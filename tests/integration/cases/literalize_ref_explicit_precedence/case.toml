schema_version = 1
owner = "literalize-ref"
# Regression provenance: C, Cpp, Gleam, Nim, ObjectiveC, V.
# Gleam must share one carrier across hints and bindings; Nim must infer imports from the emitted declaration; V represents reference hint precedence.

[ref]
gates = [{kind = "capability_flag", flag = "supports_variable_names"}]

[ref.value_sources]
ref_data = "[1, 2]"

[ref.explicit_ref_value_sources]
ref_data = "1"

[[ref_examples]]
# Regression provenance: literalize_ref_const_aliased_list
# Original regression (literalize_ref_const_lvalue): C++ reference declaration modifiers must accept the rendered value category.
example = "literalize_ref_const_aliased_list"
variable_modifiers = ["CONST"]

[[ref_examples.gates]]
kind = "capability_flag"
flag = "supports_variable_names"

[[ref_examples.gates]]
kind = "modifier_present"
modifier = "CONST"

[ref_examples.value_sources]
ref_data = "[1, 2]"

[ref_examples.explicit_ref_value_sources]
ref_data = "1"

[[ref_examples]]
# Regression provenance: literalize_ref_static_aliased_list
# Original regression (literalize_ref_static_lvalue): C++ reference declaration modifiers must accept the rendered value category.
example = "literalize_ref_static_aliased_list"
variable_modifiers = ["STATIC"]

[[ref_examples.gates]]
kind = "capability_flag"
flag = "supports_variable_names"

[[ref_examples.gates]]
kind = "modifier_present"
modifier = "STATIC"

[ref_examples.value_sources]
ref_data = "[1, 2]"

[ref_examples.explicit_ref_value_sources]
ref_data = "1"
