schema_version = 1
owner = "literalize-ref-default"

[ref]
languages = ["Cpp"]
languages_reason = "C++ must move an external reference whose own value is unknown, even with unrelated reference hints."
# The API sees only the unrelated hint; the referenced vector is declared
# afterwards so the historical unknown-value expression can compile.
external_declarations = {missing = "[1, 2]"}
fixture_suffix = "\nif (my_data != std::vector<int>{1, 2}) { return 1; }"
explicit_ref_value_sources = {other = "1"}
