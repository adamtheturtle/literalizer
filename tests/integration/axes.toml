plan = "every_non_default_member"
name_template = "{lang}_json_rendering_{format}"
option = "json_rendering"
gates = [{ kind = "spec_field_present", field = "json_rendering" }]
overrides = [
  { kind = "enum_member", option = "json_type", member = "NLOHMANN_JSON" },
]

# The settings a language may take are ``None`` -- the narrow rendering
# with no JSON value type -- together with each member of its
# ``JsonTypes`` enum.  The JSON-capable languages default to ``None``
# and gain their value type here, while D defaults to its only value
# type and narrows back.  A language whose value type is better known by
# its representation than by its member name declares that name itself.
[axes.json_type]
plan = "every_non_default_member"
name_template = "{lang}_json_type_{format}"
option = "json_type"
unset_member_name = "narrow"
member_name_source = "json_type_variant_name_suffix"
gates = [{ kind = "spec_field_present", field = "json_type" }]

