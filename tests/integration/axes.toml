# ``dict_format_config`` declares a ``narrowed_empty_form`` narrow the
# empty map this way; the others have their own, still-divergent
# handling of this shape.
[axes.empty_map_narrowing]
plan = "fixed_overrides"
name_template = "{lang}_empty_map_narrowing"
gates = [
  { kind = "spec_config_field_present", field = "dict_format_config.narrowed_empty_form" },
