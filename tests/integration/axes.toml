# Run against the ``record_wide_int`` input, these lock in that a
# record's declared field type follows the value, not the formatted
# literal (issue #2306, follow-up to #2297; extended to
# Kotlin/Java/Scala by #2376): an integer field keeps its value-derived
# type however the literal is written, and an integer beyond the signed
# 64-bit range is typed to match its wide-integer overflow-fallback
# literal instead of the type a formatted-string inspection would infer.
[axes.record_numeric_cross]
plan = "cross_product"
name_template = "{lang}_heterogeneous_strategy_record_{tag}_{secondary}"
gates = [
  { kind = "enum_member_present", option = "heterogeneous_strategy", member = "RECORD" },
]
overrides = [
  { kind = "enum_member", option = "heterogeneous_strategy", member = "RECORD" },
]
secondaries = [
  { tag = "integer", option = "integer_format" },
  { tag = "separator", option = "numeric_separator" },
  { tag = "suffix", option = "numeric_literal_suffix" },
]

[axes.record_quoted_field]
plan = "fixed_overrides"
name_template = "{lang}_record_quoted_field"
gates = [{ kind = "record_variant", variant = "quoted_field" }]
overrides = [
  { kind = "enum_member", option = "heterogeneous_strategy", member = "RECORD" },
]

[axes.record_shape_names]
plan = "fixed_overrides"
name_template = "{lang}_record_shape_names_{value}"
record_language_version = true
external_record_shape_fixture = true
gates = [
  { kind = "capability_flag", flag = "supports_record_shape_names" },
]
overrides = [
  { kind = "enum_member", option = "heterogeneous_strategy", member = "RECORD" },
  { kind = "record_shape_names", keys = [
    "id",
    "label",
    "enabled",
