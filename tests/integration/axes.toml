schema_version = 1

# Declared variant axes.  Each entry names one typed expansion plan
# from ``variant_plans.py`` and supplies that plan's parameters.  This
# file selects and parameterizes plans; it never expresses a condition.
# Axes whose expansion is genuinely irregular stay as registered
# escape-hatch builders in ``variant_cases.py``; a ``filtered`` plan
# narrows one of those, or another declared axis, to the languages its
# gates admit.

[axes.annotation_evaluation]
plan = "every_non_default_member"
name_template = "{lang}_annotation_evaluation_{format}"
option = "annotation_evaluation"
per_version = true
gates = [{ kind = "spec_field_present", field = "annotation_evaluation" }]

