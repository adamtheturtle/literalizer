# Native unary integer signatures. Selection uses language capabilities.

[python]
compile = []
execute = ["{python}", "-I", "{source}"]
scope = "body"
state = '''_expected_events = ({events},)
_event_index = 0
def observe_event(actual: int, /) -> None:
    global _event_index
    assert _event_index < {count} and actual == _expected_events[_event_index]
    _event_index += 1'''
target = '''def {target}({parameter}: int) -> int:
    observe_event(1); observe_event({parameter})
    return {parameter} + {return_increment}'''
consumer = '''def {consumer}({parameter}: int) -> None:
    observe_event(2); observe_event({parameter})'''
wrapper = '''def {wrapper}(actual: int, zipped: int, /) -> None:
    observe_event(2); observe_event(actual)
    observe_event(3); observe_event(zipped)'''
verify = '''def verify_events() -> None:
    assert _event_index == {count}'''
wrapper_unary = '''def {wrapper}({parameter}: int, /) -> None:
    observe_event(2); observe_event({parameter})'''

[javascript]
compile = []
execute = ["node", "{source}"]
scope = "body"
state = '''const expectedEvents = [{events}];
let eventIndex = 0;
function observeEvent(actual) {{
    if (eventIndex >= {count} || actual !== expectedEvents[eventIndex]) throw new Error("receiver event changed");
    eventIndex++;
}}'''
target = '''function {target}({{{parameter}}}) {{
    observeEvent(1); observeEvent({parameter});
    return {parameter} + {return_increment};
}}'''
consumer = '''function {consumer}({{{parameter}}}) {{ observeEvent(2); observeEvent({parameter}); }}'''
wrapper = '''function {wrapper}(actual, zipped) {{ observeEvent(2); observeEvent(actual); observeEvent(3); observeEvent(zipped); }}'''
verify = '''function verify_events() {{ if (eventIndex !== {count}) throw new Error("missing receiver events"); }}'''
wrapper_unary = '''function {wrapper}(actual) {{ observeEvent(2); observeEvent(actual); }}'''

[typescript]
