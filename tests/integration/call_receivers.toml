    match {parameter} with
    | FInt value -> observeEvent 2L; observeEvent value
    | _ -> failwith "integer argument required"'''
wrapper = '''let ``{wrapper}`` (actual, zipped) =
    match actual, zipped with
    | FInt value, FInt companion -> observeEvent 2L; observeEvent value; observeEvent 3L; observeEvent companion
    | _ -> failwith "integer argument required"'''
verify = '''let verify_events () =
    if eventIndex <> {count} then failwith "missing receiver events"'''
wrapper_unary = '''let ``{wrapper}`` ({parameter}) =
    match {parameter} with
    | FInt value -> observeEvent 2L; observeEvent value
    | _ -> failwith "integer argument required"'''
event_separator = "; "
event_suffix = "L"

[systemverilog]
compile = ["verilator", "--binary", "--timing", "--language", "1800-2017", "--Mdir", "{directory}/obj", "-o", "{output}", "{source}"]
execute = ["{output}"]
scope = "body"
state = '''int event_index = 0;
function automatic void observe_event(longint actual);
    longint expected[{count}] = '{{{events}}};
    if (event_index >= {count} || actual != expected[event_index]) $fatal(1, "receiver event changed");
    event_index++;
endfunction'''
target = '''function automatic _VVal {target}(_VVal {parameter});
    observe_event(1); observe_event({parameter}.i);
    return _VVal'{{tag: _VVAL_INT, i: {parameter}.i + {return_increment}, r: 0.0, s: ""}};
endfunction'''
consumer = '''function automatic void {consumer}(_VVal {parameter});
    observe_event(2); observe_event({parameter}.i);
endfunction'''
wrapper = '''function automatic void {wrapper}(_VVal actual, _VVal zipped);
    observe_event(2); observe_event(actual.i);
    observe_event(3); observe_event(zipped.i);
endfunction'''
verify = '''function automatic void verify_events();
    if (event_index != {count}) $fatal(1, "missing receiver events");
    $finish;
endfunction'''
wrapper_unary = '''function automatic void {wrapper}(_VVal {parameter});
    observe_event(2); observe_event({parameter}.i);
endfunction'''
