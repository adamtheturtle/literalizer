    return {parameter} + {return_increment};
}}'''
consumer = '''function {consumer}({{{parameter}}}: {{ {parameter}: number }}) {{ observeEvent(2); observeEvent({parameter}); }}'''
wrapper = '''function {wrapper}(actual: number, zipped: number) {{ observeEvent(2); observeEvent(actual); observeEvent(3); observeEvent(zipped); }}'''
verify = '''function verify_events(..._arguments: unknown[]) {{ if (eventIndex !== {count}) throw new Error("missing receiver events"); }}'''
wrapper_unary = '''function {wrapper}(actual: number) {{ observeEvent(2); observeEvent(actual); }}'''

[cpp]
compile = ["c++", "-std=c++14", "-Wall", "-Wextra", "-Werror", "{source}", "-o", "{output}"]
execute = ["{output}"]
scope = "body"
file_preamble = ["#include <cassert>", "#include <array>", "#include <cstddef>", "#include <iterator>"]
state = '''const std::array<int, {count}> expected_events{{{{{events}}}}};
std::ptrdiff_t event_index = 0;
const auto observe_event = [&expected_events, &event_index](int actual) {{
    assert(event_index < {count} && actual == *std::next(expected_events.cbegin(), event_index));
    ++event_index;
}};'''
target = '''const auto {target} = [&observe_event](int argument) {{
    observe_event(1); observe_event(argument);
    return argument + {return_increment};
}};'''
consumer = '''const auto {consumer} = [&observe_event](int argument) {{ observe_event(2); observe_event(argument); }};'''
wrapper = '''const auto {wrapper} = [&observe_event](int actual, int zipped) {{ observe_event(2); observe_event(actual); observe_event(3); observe_event(zipped); }};'''
verify = '''const auto verify_events = [&event_index] {{ assert(event_index == {count}); }};'''
wrapper_unary = '''const auto {wrapper} = [&observe_event](int argument) {{ observe_event(2); observe_event(argument); }};'''

[c]
compile = ["clang", "-std=c99", "-Wall", "-Wextra", "-Werror", "{source}", "-o", "{output}"]
execute = ["{output}"]
scope = "file_scope"
state = '''#include <assert.h>
static int *event_index(void) {{ static int index = 0; return &index; }}
static void observe_event(long long actual) {{
    const long long expected[] = {{{events}}};
    assert(*event_index() < {count} && actual == expected[*event_index()]);
    ++*event_index();
}}'''
target = '''static CVal {target}(CVal argument) {{
    observe_event(1); observe_event(argument.i);
    return (CVal){{.i = argument.i + {return_increment}}};
}}'''
consumer = '''static void {consumer}(CVal argument) {{ observe_event(2); observe_event(argument.i); }}'''
wrapper = '''static void {wrapper}(CVal actual, CVal zipped) {{ observe_event(2); observe_event(actual.i); observe_event(3); observe_event(zipped.i); }}'''
verify = '''static void verify_events(void) {{ assert(*event_index() == {count}); }}'''
wrapper_unary = '''static void {wrapper}(CVal argument) {{ observe_event(2); observe_event(argument.i); }}'''

[go]
compile_timeout_seconds = 180
compile = ["go", "build", "-o", "{output}", "{source}"]
execute = ["{output}"]
scope = "file_scope"
state = '''var eventIndex = 0
func observeEvent(actual int) {{
    expected := []int{{{events}}}
    if eventIndex >= {count} || actual != expected[eventIndex] {{ panic("receiver event changed") }}
    eventIndex++
}}'''
target = '''func {target}({parameter} int) int {{ observeEvent(1); observeEvent({parameter}); return {parameter} + {return_increment} }}'''
consumer = '''func {consumer}({parameter} int) {{ observeEvent(2); observeEvent({parameter}) }}'''
wrapper = '''func {wrapper}(actual int, zipped int) {{ observeEvent(2); observeEvent(actual); observeEvent(3); observeEvent(zipped) }}'''
verify = '''func verify_events() {{ if eventIndex != {count} {{ panic("missing receiver events") }} }}'''
wrapper_unary = '''func {wrapper}({parameter} int) {{ observeEvent(2); observeEvent({parameter}) }}'''

