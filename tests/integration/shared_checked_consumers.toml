        calls++;
        return user == "user_1";
    }}
}}
class Program {{
    static int checks;
    static void checkResult(bool actual, (bool, string) expected) {{
        if (actual != expected.Item1 || expected.Item2 != (checks == 0 ? "first" : "second")) throw new System.Exception("paired result changed");
        checks++;
    }}
    static void Main() {{
        var counter = new Counter();
{bare_code}
        if (counter.calls != {expected_calls} || checks != {expected_calls}) throw new System.Exception("calls skipped");
    }}
}}
'''

[Cpp]
