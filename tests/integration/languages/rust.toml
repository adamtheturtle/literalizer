schema_version = 1

[golden]
# Collision regressions intentionally preserve caller-supplied spelling.
# Keep the compiler's other warnings fatal for these fixtures.
intentional_identifier_preamble = ["// Preserve intentional caller identifier spelling.", "#![allow(non_snake_case)]"]

[variants]
supports_special_float_dict_keys = false
record = ["field_type_split", "keyword_field", "unify_optional_fields"]

[variants.empty_container_type_hint]
heterogeneous_strategy = "TAGGED_ENUM"

[[variants.empty_container_type_hint.type_hints]]
path = [1]
hint = "HashMap<String, String>"

[variants.non_default_kwargs]
default_set_element_type = "i32"
default_sequence_element_type = "i32"
default_dict_value_type = "i32"
default_dict_key_type = "&str"
heterogeneous_value_enum_name = "JsonValue"

[variants.declaration_style_sequence_format_overrides]
CONST = "ARRAY"
STATIC = "ARRAY"

[variants.declaration_style_variable_names]
CONST = "MY_DATA"
STATIC = "MY_DATA"
LAZY_STATIC = "MY_DATA"
