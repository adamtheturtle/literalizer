schema_version = 1

[golden.reference_check]
target_function = "json"
transform = '''
([&]() noexcept {{
    try {{
        return {call} == json::parse({zipped});
    }} catch (...) {{
        return false;
    }}
}}() ? static_cast<void>(0) : std::abort())'''
preamble = '''
#include <cstdlib>
#include <nlohmann/json.hpp>
using nlohmann::json;
'''

[variants]
pre_indent_comment_scalar = true
record = ["field_type_split"]
record_language_version = "CPP14"
heterogeneous_value_variant_name_strategy = "ERROR"
heterogeneous_value_variant_name_language_version = "CPP14"

[variants.non_default_kwargs]
heterogeneous_value_variant_name = "DynamicValue"
multiline_raw_string_delimiter_base = "x0"
