schema_version = 1
summary = "Exercise names reserved for special runtime variables."
exceptions = ["ReservedVariableNameError"]
values = ["ARGV", "ENV", "INC", "SIG", "STDERR", "STDIN", "STDOUT"]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
