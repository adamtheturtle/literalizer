schema_version = 1
summary = "Exercise a binding name that overlaps a helper emitted by the JSON value representation."
exceptions = ["ReservedVariableNameError"]

[call]
api = "literalize"
sources = ['{"$ref":"allocator"}']
input_format = "json"
wrap_in_file = false
ref_key = "$ref"
bound_ref_yaml = { allocator = "a: 1" }
kwargs = [{ kind = "option_member", option = "json_type", member = "STD_JSON_VALUE" }]
