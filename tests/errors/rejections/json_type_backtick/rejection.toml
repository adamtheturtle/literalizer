schema_version = 1
summary = "Exercise backticks in JSON string values and object keys embedded in a raw string."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"name": "a`b"}', '{"a`b": 1}']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "json_type", member = "JSON_VALUE" },
]
