schema_version = 1
summary = "An ordered map cannot contain a record below nested tuple levels."
exceptions = ["UnrepresentableInputError"]
languages = ["Swift"]

[call]
api = "literalize"
sources = ['''!!omap
- groups:
  - - id: 1
''']
input_format = "yaml"
variable_form = "none"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
  { kind = "option_member", option = "sequence_format", member = "TUPLE" },
]
