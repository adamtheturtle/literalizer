schema_version = 1
summary = "Exercise assertion and logic keywords as generated call targets."
exceptions = ["InvalidCallTargetError"]
values = ["and", "assert", "before", "let", "new", "not", "null", "or"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
