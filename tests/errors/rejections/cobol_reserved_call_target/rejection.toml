schema_version = 1
summary = "Cobol reserved words that no program name or data name can take as a call target."
exceptions = ["InvalidCallTargetError"]
languages = ["Cobol"]
values = ["function", "null"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
