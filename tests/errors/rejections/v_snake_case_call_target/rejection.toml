schema_version = 1
summary = "V function names are snake_case and cannot start with an underscore."
exceptions = ["InvalidCallTargetError"]
languages = ["V"]
values = ["_do_thing", "doThing"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["x"]
wrap_in_file = true
