schema_version = 1
summary = "Exercise raw-string delimiter bases beyond the length or character restrictions."
exceptions = ["InvalidCppRawStringDelimiterError"]
values = [
  "",
  "abcdefghijklmnopq",
  "at@",
  "back\\slash",
  "dollar$",
  "grave`",
  "has space",
  "left(",
  "line\nbreak",
  "non-ascii-£",
  "right)",
  "tab\tcharacter",
]

[call]
api = "constructor"
kwargs = [
  { kind = "text", kwarg = "multiline_raw_string_delimiter_base", value = "{value}" },
]
