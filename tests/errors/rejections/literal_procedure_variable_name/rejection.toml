schema_version = 1
summary = "Exercise declaration names that can shadow procedures used by literals."
exceptions = ["ReservedVariableNameError"]
values = ["date", "hash", "list", "make-keyword-procedure", "set", "void"]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
