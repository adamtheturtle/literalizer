schema_version = 1
summary = "Exercise primitive type names as declaration identifiers."
exceptions = ["ReservedVariableNameError"]
values = [
  "boolean",
  "byte",
  "char",
  "double",
  "float",
  "int",
  "long",
  "short",
  "void",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
