schema_version = 1
summary = "JSONC number range errors retain original source coordinates across line endings."
exceptions = ["JSONCParseError"]
position = [2, 7]

[call]
api = "literalize"
sources = [
    "/* heading */\n{\"a\": 1e999}",
    "/* heading */\r{\"a\": 1e999}",
    "/* heading */\r\n{\"a\": 1e999}",
]
input_format = "jsonc"
variable_form = "none"
