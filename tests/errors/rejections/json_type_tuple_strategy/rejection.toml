schema_version = 1
summary = """
A JSON value type leaves nowhere for the tuple type declarations the
TUPLE strategy generates.
"""
exceptions = ["IncompatibleFormatsError"]
option = "json_type"
gates = [
  { kind = "spec_field_present", field = "json_type" },
  { kind = "enum_member_present", option = "heterogeneous_strategy", member = "TUPLE" },
]

[call]
api = "constructor"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "TUPLE" },
]

[[accepts]]
languages = ["Rust", "Scala"]
reason = """
Renders tuples alongside the JSON value type rather than instead of it,
so the two settings compose.
"""
