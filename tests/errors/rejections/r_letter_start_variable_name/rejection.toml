schema_version = 1
summary = "R symbols begin with a letter, so a leading underscore is a syntax error."
exceptions = ["InvalidNewVariableNameError"]
languages = ["R"]
values = ["_", "__x", "_x"]

[call]
api = "literalize"
sources = ['{"a": 1}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
