schema_version = 1
summary = "Exercise constant mappings with empty and nonempty array values of different lengths."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"a": [1], "b": []}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
kwargs = [
  { kind = "option_member", option = "declaration_style", member = "CONST" },
]
