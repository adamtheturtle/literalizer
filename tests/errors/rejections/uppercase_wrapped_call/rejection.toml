schema_version = 1
summary = "Roc and V wrapped function declarations require lowercase names."
exceptions = ["InvalidCallTargetError"]
languages = ["Roc", "V"]
values = ["DoThing", "Playlist.new"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["value"]
wrap_in_file = true
