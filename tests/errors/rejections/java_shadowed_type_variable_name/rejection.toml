schema_version = 1
summary = "Java declarations cannot shadow an emitted type or entry-point name."
exceptions = ["ReservedVariableNameError"]
languages = ["Java"]
values = [
  "Array",
  "Boolean",
  "Double",
  "Integer",
  "List",
  "Map",
  "String",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
