schema_version = 1
summary = "Exercise a boolean reference binding with an explicit floating-point hint."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"$ref":"seed"}']
input_format = "json"
ref_key = "$ref"
bound_ref_yaml = { seed = "true" }
ref_value_yaml = { seed = "1.5" }
modifiers = ["STATIC"]
wrap_in_file = true
