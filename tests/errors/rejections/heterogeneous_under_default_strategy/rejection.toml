schema_version = 1
summary = """
A language with an opt-in wrapping strategy still refuses
heterogeneous input under its default ERROR strategy. The same
constraint is asserted for the affected literal golden cases.
"""
exceptions = [
  "HeterogeneousScalarCollectionError",
  "HeterogeneousSiblingListsError",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": "x"}', '[[1, 2], ["a", "b"]]']
input_format = "json"
