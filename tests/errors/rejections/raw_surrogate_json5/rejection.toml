schema_version = 1
summary = "JSON5 rejects raw lone high and low surrogates in nested values and keys."
exceptions = ["JSON5ParseError"]

[call]
api = "literalize"
sources = [
    "{outer: [{value: \"{high}\"}]}",
    "{outer: [{value: \"{low}\"}]}",
    "{outer: [{\"{high}\": \"value\"}]}",
    "{outer: [{\"{low}\": \"value\"}]}",
]
input_format = "json5"
variable_form = "none"

