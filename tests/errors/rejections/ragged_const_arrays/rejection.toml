schema_version = 1
summary = "Exercise constant array literals whose sibling lengths cannot share a fixed-size type."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"a": [[1, 2], [3]]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
kwargs = [
  { kind = "option_member", option = "declaration_style", member = "CONST" },
]
