schema_version = 1
summary = "Cobol figurative constants cannot be used as variable names."
exceptions = ["ReservedVariableNameError"]
languages = ["Cobol"]
values = [
  "HIGH-VALUE",
  "HIGH-VALUES",
  "LOW-VALUE",
  "LOW-VALUES",
  "QUOTE",
  "QUOTES",
  "SPACE",
  "SPACES",
  "ZERO",
  "ZEROES",
  "ZEROS",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
