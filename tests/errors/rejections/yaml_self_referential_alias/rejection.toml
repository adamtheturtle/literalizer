schema_version = 1
summary = "A YAML alias naming the node that contains it has no value."
exceptions = ["YAMLParseError"]
languages = ["Python"]

[call]
api = "literalize"
sources = [
  "a: &a [1, *a]",
  "a: &a [*a]",
  "a: &a {b: *a}",
  "&a {a: *a}",
  # Malformed, and the alias names no open anchor, so the event scan
  # gives up and the load reports the syntax error with a position.
  "a: &a [1, *b",
]

input_format = "yaml"
