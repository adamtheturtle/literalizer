schema_version = 1
summary = """
These grammars reserve an initial capital for a constructor, type or
module name, so a variable cannot take one.
"""
exceptions = ["InvalidNewVariableNameError"]
languages = ["Crystal", "Elixir", "Gleam", "Haskell", "Sml"]

[call]
api = "literalize"
sources = ["1"]
