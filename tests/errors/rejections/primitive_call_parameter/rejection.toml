schema_version = 1
summary = "Exercise parameter names that overlap primitives or the generated entrypoint."
exceptions = ["InvalidCallParameterNameError"]
values = ["_", "bool", "comptime_int", "f16", "i33", "main", "type", "u7", "void"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "do_thing"
parameter_names = ["{value}"]
wrap_in_file = true
