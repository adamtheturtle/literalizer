schema_version = 1
summary = "Exercise heterogeneous elements and sibling array shapes in independent record fields."
exceptions = ["HeterogeneousScalarCollectionError", "HeterogeneousSiblingListsError", "UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{values: [1, s]}', '{values: [[1], [s]]}', '{1: [1], 2: [s]}']
input_format = "yaml"
wrap_in_file = true
variable_form = "new"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
  { kind = "option_member", option = "sequence_format", member = "ARRAY" },
]
