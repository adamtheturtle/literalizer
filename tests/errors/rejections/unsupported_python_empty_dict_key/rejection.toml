schema_version = 1
summary = "Unsupported Python options retain the language and option names."
exceptions = ["UnsupportedOptionError"]
languages = ["Python"]

[attributes]
language_name = "Python"
option = "empty_dict_key"

[call]
api = "constructor"
kwargs = [
  { kind = "option_unset", option = "empty_dict_key" },
]
