schema_version = 1
summary = """
In Standard ML an underscore is the wildcard pattern, so a name
beginning with one is read as the wildcard applied to what follows.
"""
exceptions = ["InvalidNewVariableNameError"]
languages = ["Sml"]

[call]
api = "literalize"
sources = ['{"a": 1}']
input_format = "json"
variable_form = "new"
variable_name = "_leading"
wrap_in_file = true
