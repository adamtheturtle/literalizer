schema_version = 1
summary = """
An Erlang module name becomes an atom, which the virtual machine caps
at 255 characters.
"""
exceptions = ["InvalidModuleNameError"]
languages = ["Erlang"]

[call]
api = "constructor"
kwargs = [{ kind = "text", kwarg = "module_name", value = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }]
