schema_version = 1
summary = "An explicit scalar hint cannot type a C# tuple-valued static field."
exceptions = ["UnrepresentableInputError"]
languages = ["CSharp"]

[call]
api = "literalize"
sources = ['{ "$ref": "ref_data" }']
input_format = "json"
ref_key = "$ref"
bound_ref_yaml = { ref_data = "[1, 2]" }
ref_value_yaml = { ref_data = "1" }
# The omitted form declares NewVariable("my_data") with these modifiers.
modifiers = ["STATIC"]
wrap_in_file = true
