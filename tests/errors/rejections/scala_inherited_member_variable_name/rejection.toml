schema_version = 1
summary = "A Scala value cannot silently override an inherited Any member."
exceptions = ["ReservedVariableNameError"]
languages = ["Scala"]
values = [
  "clone",
  "finalize",
  "hashCode",
  "notify",
  "notifyAll",
  "toString",
  "wait",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
