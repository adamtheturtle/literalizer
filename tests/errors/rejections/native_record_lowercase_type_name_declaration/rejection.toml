schema_version = 1
summary = "Exercise a lowercase native record type name in a declaration."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"x":1}']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
  { kind = "text", kwarg = "type_name", value = "lowercase" },
]
