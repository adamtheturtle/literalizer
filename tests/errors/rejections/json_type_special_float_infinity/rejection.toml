schema_version = 1
summary = """
JSON has no syntax for infinity, so a JSON value type built from a JSON
document cannot carry one.
"""
# Odin reports this as UnrepresentableInputError where the other six
# languages raise UnrepresentableSpecialFloatError; tracked in issue
# #3560, after which this list narrows to the special-float error.
exceptions = [
  "UnrepresentableSpecialFloatError",
  "UnrepresentableInputError",
]
option = "json_type"
gates = [{ kind = "spec_field_present", field = "json_type" }]

[call]
api = "literalize"
source = "[Infinity]"
input_format = "json5"

[[accepts]]
languages = [
  "C",
  "CSharp",
  "Cpp",
  "D",
  "Elm",
  "FSharp",
  "Java",
  "Kotlin",
  "Nim",
  "OCaml",
  "Rust",
  "Scala",
]
reason = """
Builds the JSON value from typed constructor calls rather than from a
JSON document, so a non-finite float reaches the language's own float
syntax.
"""
