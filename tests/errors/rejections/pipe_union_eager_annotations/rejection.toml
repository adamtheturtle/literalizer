schema_version = 1
summary = "Exercise eager evaluation of pipe-union annotations under versions predating that syntax."
exceptions = ["IncompatibleFormatsError"]
values = ["PY38", "PY39"]

[call]
api = "constructor"
kwargs = [
  { kind = "option_member", option = "annotation_evaluation", member = "EAGER" },
  { kind = "option_member", option = "union_format", member = "PIPE" },
  { kind = "option_member", option = "language_version", member = "{value}" },
]
