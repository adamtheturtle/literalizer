schema_version = 1
summary = """
Rust tuple fields are independent, but corresponding map fields in tuples
sharing a map-value slot still require one concrete value type (#6200).
The shared native_record_mixed_field_type_refinement sequence variants
retain compiler-backed coverage for representations that support the input.
"""
exceptions = ["HeterogeneousSiblingMapsError"]
values = ["TUPLE", "TUPLE_NESTED_VEC"]

[call]
api = "literalize"
sources = [
  '{"first":{"items":[1,{"value":2}]},"second":{"items":[1,{"value":"s"}]}}',
  '{"second":{"items":[1,{"value":"s"}]},"first":{"items":[1,{"value":2}]}}',
]
input_format = "json"
kwargs = [
  { kind = "option_member", option = "sequence_format", member = "{value}" },
]
