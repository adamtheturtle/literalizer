schema_version = 1
summary = "Zig json call reference bindings cannot shadow the mode's helpers."
exceptions = ["ReservedVariableNameError"]

[call]
api = "literalize_call"
sources = ['{"$ref":"allocator"}']
input_format = "json"
wrap_in_file = true
ref_key = "$ref"
bound_ref_yaml = { allocator = "a: 1" }
target_function = "process"
parameter_names = ["value"]
per_element = false
kwargs = [{ kind = "option_member", option = "json_type", member = "STD_JSON_VALUE" }]
