schema_version = 1
summary = "Exercise leading, trailing, and doubled underscores in generated record fields."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
  '[{"__": 1}]',
  '[{"_x": 1}]',
  '[{"x_": 1}]',
]
input_format = "json"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
]
