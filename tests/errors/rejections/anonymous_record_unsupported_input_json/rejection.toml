schema_version = 1
summary = "Invalid native shapes fail clearly instead of emitting bad F#."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
    '{"not-a-field": 1}',
    '{"let": 1}',
    '{}',
    '{"x": null}',
    '[{"x": 1}, {"x": "one"}]',
    '[{"x": 1}, {"y": 1}]',
]
input_format = "json"
variable_form = "none"
kwargs = [
    {kind = "option_member", option = "dict_format", member = "ANONYMOUS_RECORD"},
]
