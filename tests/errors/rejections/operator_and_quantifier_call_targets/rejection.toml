schema_version = 1
summary = "Exercise operator and quantifier keywords as generated call targets."
exceptions = ["InvalidCallTargetError"]
values = ["abs", "and", "parallel", "some"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
