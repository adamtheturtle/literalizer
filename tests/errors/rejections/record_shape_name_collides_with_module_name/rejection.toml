schema_version = 1
summary = "Exercise a record shape name sharing a declaration scope with the wrapper module."
exceptions = ["InvalidRecordNameError"]

[call]
api = "constructor"
kwargs = [
  { kind = "text", kwarg = "module_name", value = "Entry" },
  { kind = "record_shape_names", key_sets = [["id", "name"]], names = ["Entry"] },
]
