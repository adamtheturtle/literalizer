schema_version = 1
summary = "A materialized bound set cannot use null as a Lua table key."
exceptions = ["UnrepresentableInputError"]
languages = ["Lua"]

[call]
api = "literalize"
sources = ['[{"$ref": "items"}]']
input_format = "json"
variable_form = "new"
variable_name = "value"
wrap_in_file = true
ref_key = "$ref"
bound_ref_yaml = { "items" = "!!set\n? null\n" }
