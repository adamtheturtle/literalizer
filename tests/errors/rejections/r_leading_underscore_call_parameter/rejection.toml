schema_version = 1
summary = "An R symbol cannot begin with an underscore."
exceptions = ["InvalidCallParameterNameError"]
languages = ["R"]
values = ["_", "_1", "_x"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "do_thing"
parameter_names = ["{value}"]
wrap_in_file = true
