schema_version = 1
summary = """
A call argument is built as the same JSON value a declared one is,
and that type has no signed zero.
"""
exceptions = ["UnrepresentableInputError"]
languages = ["Elm", "Haskell", "PureScript"]
option = "json_type"

[call]
api = "literalize_call"
sources = ['[[-0.0]]']
input_format = "json"
target_function = "process"
parameter_names = ["value"]
per_element = true
