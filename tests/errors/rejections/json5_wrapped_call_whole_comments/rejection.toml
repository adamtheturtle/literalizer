schema_version = 1
summary = "JSON5 comments cannot be preserved in wrapped Erlang calls."
exceptions = ["UnsupportedCallShapeError"]

[call]
api = "literalize_call"
sources = [
    "/* heading */ [[1]]",
]
input_format = "json5"
target_function = "f"
parameter_names = ["a"]
per_element = false
wrap_in_file = true
