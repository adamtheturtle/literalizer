schema_version = 1
summary = """
A JSON value type keys its objects with strings, so a dict with a
non-string key has no representation under one, whether that dict is
the whole document or nested inside it.
"""
exceptions = ["UnrepresentableInputError"]
option = "json_type"
gates = [{ kind = "spec_field_present", field = "json_type" }]

[call]
api = "literalize"
sources = ["{1: one}", "[{1: one}]"]
input_format = "yaml"
