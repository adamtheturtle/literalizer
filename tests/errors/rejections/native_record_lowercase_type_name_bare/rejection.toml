schema_version = 1
summary = "Exercise a lowercase native record type name when rendering a bare value."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
    '{"x":1}',
]
input_format = "json"
variable_form = "none"
kwargs = [
    {kind = "option_member", option = "dict_format", member = "RECORD"},
    {kind = "text", kwarg = "type_name", value = "lowercase"},
]
