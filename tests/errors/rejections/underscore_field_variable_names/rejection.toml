schema_version = 1
summary = "Exercise leading-underscore names as top-level declarations rather than class fields."
exceptions = ["ReservedVariableNameError"]
values = ["_", "_field"]

[call]
api = "literalize"
sources = ["[1, 2]"]
input_format = "json"
variable_form = "new"
variable_name = "{value}"
wrap_in_file = true
