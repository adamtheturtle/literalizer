schema_version = 1
summary = "Exercise a tuple-eligible sequence whose length differs from fixed pair and triple arities."
exceptions = ["TupleArityNotRepresentableError"]

[call]
api = "literalize"
sources = [
  "- 1\n- email\n- a@gmail.com\n- 100\n- x\n",
  "call: send\nargs:\n  - 1\n  - email\n  - a@gmail.com\n  - 100\n",
]
input_format = "yaml"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "TUPLE" },
]
