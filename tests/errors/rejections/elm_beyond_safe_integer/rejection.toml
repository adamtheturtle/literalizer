schema_version = 1
summary = """
Elm's supported safe integer range is -(2**53 - 1) to 2**53 - 1.
Both decimal and hexadecimal formats reject values outside it (#3683),
including the signed 64-bit minimum previously special-cased by the
raw formatter (#5196).
"""
exceptions = ["UnrepresentableIntegerError"]
languages = ["Elm"]
option = "integer_format"

[call]
api = "literalize"
sources = [
  "9007199254740992",
  "-9007199254740992",
  "-9223372036854775808",
]
input_format = "json"
