"PureScript['{\"case\": 1}']" = "PureScript record mode cannot represent field 'case'"
"PureScript['{\"Bad\": 1}']" = "PureScript record mode cannot represent field 'Bad'"
"PureScript['{}']" = "PureScript record mode cannot represent empty records"
