"PureScript['[{\"x\": 1}, {\"x\": \"one\"}]']" = "PureScript record mode requires uniform record array types"
"PureScript['[{\"x\": 1}, {\"y\": 1}]']" = "PureScript record mode requires uniform record array types"
"PureScript['[1, 2147483648]']" = "PureScript record mode requires uniform integer widths"
