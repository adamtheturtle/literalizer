  "- \"Self\": a\n  other: b\n",
  "- \"_\": a\n  other: b\n",
  "- \"crate\": a\n  other: b\n",
  "- \"foo-bar\": a\n  other: b\n",
  "- \"has space\": a\n  other: b\n",
  "- \"self\": a\n  other: b\n",
  "- \"super\": a\n  other: b\n",
]
input_format = "yaml"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
]
