schema_version = 1
summary = "A per-element companion source must parse to a top-level list."
exceptions = ["PerElementNotListError"]
languages = ["Python"]

[call]
api = "literalize_call"
sources = ["[[1], [2]]"]
input_format = "json"
target_function = "process"
parameter_names = ["value"]
call_transform = "emit({call}, {zipped})"
zip_source = '"not a list"'
zip_input_format = "json"
