schema_version = 1
summary = "Exercise a native time binding with a nonzero UTC offset."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ["{\"x\": {\"$ref\": \"value\"}}"]
input_format = "json"
variable_form = "new"
variable_name = "out"
wrap_in_file = true
ref_key = "$ref"
bound_ref_times = { value = "12:30:15+02:00" }
