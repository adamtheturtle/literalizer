schema_version = 1
summary = "Exercise an unsupported constructor option while preserving its option and target names in the public error."
exceptions = ["UnsupportedOptionError"]

[attributes]
language_name = "{language}"
option = "default_dict_value_type"

[call]
api = "constructor"
kwargs = [
  { kind = "text", kwarg = "default_dict_value_type", value = "String" },
]
