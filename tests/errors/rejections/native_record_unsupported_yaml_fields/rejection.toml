schema_version = 1
summary = """
Concrete Gleam and OCaml records require string field names and cannot
represent YAML ordered maps or sets.
"""
exceptions = ["UnrepresentableInputError"]
languages = ["Gleam", "OCaml"]

[call]
api = "literalize"
sources = [
  "1: one\n",
  "--- !!omap\n- a: 1\n",
  "--- !!set\na:\n",
]
input_format = "yaml"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
]
