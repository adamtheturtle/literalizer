schema_version = 1
summary = "Exercise null as a set member supplied through a bound reference."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['[{"$ref": "items"}]']
input_format = "json"
variable_form = "new"
variable_name = "value"
wrap_in_file = true
ref_key = "$ref"
bound_ref_yaml = { "items" = "!!set\n? null\n" }
