wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "TAGGED_ENUM" },
  { kind = "empty_container_type_hints", hints = [{ path = [1], type_name = "HashMap<String, String>" }, { path = [2], type_name = "HashMap<String, bool>" }] },
]
