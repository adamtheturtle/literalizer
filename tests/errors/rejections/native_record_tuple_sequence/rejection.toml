schema_version = 1
summary = "Exercise tuple sequences where native record fields require uniform list types."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize"
sources = ['{"x":[1]}']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
  { kind = "option_member", option = "sequence_format", member = "TUPLE" },
]
