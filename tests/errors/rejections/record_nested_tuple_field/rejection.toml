schema_version = 1
summary = "Exercise record dictionaries below tuple levels whose inferred and rendered types may differ."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['{"groups": [[{"id": 1}], [{"name": "x"}]]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
  { kind = "option_member", option = "sequence_format", member = "TUPLE" },
]
