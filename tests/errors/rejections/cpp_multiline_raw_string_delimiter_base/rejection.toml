schema_version = 1
summary = """
A C++ raw string is delimited by d-chars: at most 16 of them, drawn
from the basic character set and excluding the parentheses, the
backslash and whitespace.  A base outside that set is refused when the
language is built rather than when it renders.
"""
exceptions = ["InvalidCppRawStringDelimiterError"]
languages = ["Cpp"]
values = [
  "",
  "abcdefghijklmnopq",
  "at@",
  "back\\slash",
  "dollar$",
  "grave`",
  "has space",
  "left(",
  "line\nbreak",
  "non-ascii-£",
  "right)",
  "tab\tcharacter",
]

[call]
api = "constructor"
kwargs = [
  { kind = "text", kwarg = "multiline_raw_string_delimiter_base", value = "{value}" },
]
