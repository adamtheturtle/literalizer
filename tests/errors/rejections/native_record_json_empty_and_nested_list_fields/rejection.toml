schema_version = 1
summary = "Exercise empty and deeply nested list fields in native records."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
    '{"bad-key":1}',
    '{"case":1}',
    '{}',
    '{"x":null}',
    '{"x":[]}',
    '{"x":[[{"y":1}]]}',
]
input_format = "json"
variable_form = "none"
kwargs = [
    {kind = "option_member", option = "dict_format", member = "RECORD"},
]
