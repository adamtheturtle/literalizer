schema_version = 1
summary = "Exercise exit, nil, panic, print, and println as call targets."
exceptions = ["InvalidCallTargetError"]
values = ["exit", "nil", "panic", "print", "println"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
