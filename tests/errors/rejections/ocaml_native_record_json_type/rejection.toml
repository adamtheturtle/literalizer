schema_version = 1
summary = "OCaml concrete records and the JSON value backend are distinct output modes."
exceptions = ["IncompatibleFormatsError"]
languages = ["OCaml"]

[call]
api = "literalize"
sources = ['{"x":1}']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
  { kind = "option_member", option = "json_type", member = "YOJSON_SAFE_T" },
]
