schema_version = 1
summary = "Exercise division and section headers as declaration names."
exceptions = ["ReservedVariableNameError"]
values = [
  "DATA",
  "DIVISION",
  "IDENTIFICATION",
  "PROCEDURE",
  "PROGRAM-ID",
  "SECTION",
  "WORKING-STORAGE",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
