schema_version = 1
summary = "Exercise compile-time constant declarations of collections and temporal values."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize"
sources = [
  "!!set {1, 2}",
  "2024-01-15",
  "2024-01-15T12:30:00",
  "[1, 2, 3]",
  "{a: 1}",
]
input_format = "yaml"
wrap_in_file = true
modifiers = ["CONST"]
