schema_version = 1
summary = "Call transforms require an expression call style that can be wrapped."
exceptions = ["UnsupportedCallShapeError"]
languages = ["Tcl"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "process"
parameter_names = ["value"]
call_transform = "emit({call})"
