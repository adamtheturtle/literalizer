schema_version = 1
summary = "Exercise tuple-valued call arguments with a generic parameter carrier."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize_call"
input_format = "json"
target_function = "process"
parameter_names = ["value"]
wrap_in_file = true
sources = [
    '[[[1, 2]]]',
    '[null, [[1, 2]]]',
    '[[{"items": [1, 2]}]]',
]
kwargs = [{ kind = "option_member", option = "sequence_format", member = "TUPLE" }]
