schema_version = 1
summary = "JSONC rejects escaped lone UTF-16 surrogates in nested values and keys."
exceptions = ["JSONCParseError"]
languages = ["Python"]

[call]
api = "literalize"
sources = [
    '{"outer": [{"value": "\ud800"}]}',
    '{"outer": [{"value": "\udc00"}]}',
    '{"outer": [{"\ud800": "value"}]}',
    '{"outer": [{"\udc00": "value"}]}',
]
input_format = "jsonc"
variable_form = "none"
