schema_version = 1
summary = "Exercise native record field names, ordered mappings, and sets supplied through YAML."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
  "1: one\n",
  "--- !!omap\n- a: 1\n",
  "--- !!set\na:\n",
]
input_format = "yaml"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
]
