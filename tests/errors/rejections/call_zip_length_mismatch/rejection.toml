schema_version = 1
summary = "A companion source must contain one value per generated call."
exceptions = ["ZipValuesLengthMismatchError"]
languages = ["Python"]

[call]
api = "literalize_call"
sources = ["[[1], [2]]"]
input_format = "json"
target_function = "process"
parameter_names = ["value"]
call_transform = "emit({call}, {zipped})"
zip_source = "[true, false, true]"
zip_input_format = "json"
