schema_version = 1
summary = """
A case-insensitive language reads two spellings of one name as one
parameter, so a stub declaring both would declare it twice.
"""
exceptions = ["InvalidCallParameterNameError"]
languages = ["Ada"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "f"
parameter_names = ["Count", "count"]
