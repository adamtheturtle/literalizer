schema_version = 1
summary = """
These seventeen COBOL reserved words cannot name a data item; GnuCOBOL
rejects each one when used as an 01 name (#4771).
"""
exceptions = ["ReservedVariableNameError"]
languages = ["Cobol"]
values = [
    "all",
    "copy",
    "count",
    "date",
    "day",
    "first",
    "key",
    "last",
    "length",
    "number",
    "object",
    "self",
    "size",
    "string",
    "test",
    "time",
    "type",
]

[call]
api = "literalize"
sources = ['{"a": 1}']
input_format = "json"
variable_form = "new"
variable_name = "{value}"
wrap_in_file = true
