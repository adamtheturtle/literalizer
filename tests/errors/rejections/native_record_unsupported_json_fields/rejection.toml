schema_version = 1
summary = "Exercise native records with invalid names, empty fields, nulls, and nested collections."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
  '{"bad-key":1}',
  '{"let":1}',
  '{}',
  '{"x":null}',
  '{"x":[]}',
  '{"x":[[{"y":1}]]}',
]
input_format = "json"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
]
