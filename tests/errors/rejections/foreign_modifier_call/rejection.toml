schema_version = 1
summary = "Exercise call-result modifiers from every enum offering the requested member."
exceptions = ["InvalidVariableModifierError"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "consume"
parameter_names = ["value"]
variable_form = "new"
variable_name = "value"
modifiers = ["FINAL"]
modifier_source = "all"
