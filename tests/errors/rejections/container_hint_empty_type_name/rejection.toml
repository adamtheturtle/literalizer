schema_version = 1
summary = "Exercise an empty-container hint whose type name is empty."
exceptions = ["ValueError"]

[call]
api = "literalize"
sources = ["[1, {}]"]
input_format = "json"
variable_form = "new"
variable_name = "my_data"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "TAGGED_ENUM" },
  { kind = "empty_container_type_hints", hints = [{ path = [1], type_name = "" }] },
]
