schema_version = 1
summary = """
Dotted components that differ only in case share one generated helper
type in a backend whose helper naming normalizes component case.
"""
exceptions = ["InvalidCallTargetError"]
gates = [
  { kind = "capability_flag", flag = "dotted_call_stub_requires_unique_parts" },
]

[call]
api = "literalize_call"
sources = ["[1]"]
input_format = "json"
target_function = "a.foo.Foo.bar"
parameter_names = ["x"]
per_element = false
wrap_in_file = true
