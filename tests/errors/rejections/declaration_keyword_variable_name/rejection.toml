schema_version = 1
summary = "Exercise declaration keywords as variable names."
exceptions = ["ReservedVariableNameError"]
values = ["abstract", "mutable", "primitive", "type", "where"]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
