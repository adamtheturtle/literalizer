schema_version = 1
summary = "Exercise a backtick in a call argument embedded in a JSON raw string."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize_call"
sources = ['- "a`b"']
input_format = "yaml"
target_function = "process"
parameter_names = ["x"]
kwargs = [
  { kind = "option_member", option = "json_type", member = "JSON_VALUE" },
]
