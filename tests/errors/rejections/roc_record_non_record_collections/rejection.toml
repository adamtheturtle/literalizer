schema_version = 1
summary = "Ordered maps and sets retain the default tagged representation."
exceptions = ["UnrepresentableInputError"]
languages = ["Roc"]

[call]
api = "literalize"
sources = [
    '''--- !!omap
- a: 1
''',
    '''---
- x: !!set
    a:
- x: !!set
    b:
''',
]
input_format = "yaml"
variable_form = "none"
kwargs = [
    {kind = "option_member", option = "dict_format", member = "RECORD"},
]
