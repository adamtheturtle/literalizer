schema_version = 1
summary = "Exercise mixed and empty collections without a common inferred type in narrow mode."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = ['[1, "two"]', "[]", '{"a": 1, "b": "two"}', "{}"]
input_format = "json"
kwargs = [
  { kind = "option_unset", option = "json_type" },
]
