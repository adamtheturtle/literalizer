schema_version = 1
summary = """
A final field is assigned once, so it cannot take a declaration and a
later assignment to the same name.
"""
exceptions = ["ImmutableVariableModifierError"]
gates = [{ kind = "modifier_present", modifier = "FINAL" }]

[call]
api = "literalize"
sources = ["[1, 2]"]
input_format = "json"
variable_form = "both"
variable_name = "my_val"
modifiers = ["FINAL"]
wrap_in_file = true
