schema_version = 1
summary = """
C native arrays cannot be reassigned. Preserve this public error boundary
instead of emitting a CVal array initializer containing generated structs.
The declaration-only record-array cases remain compiling goldens (#5236).
"""
exceptions = ["UnrepresentableInputError", "ValueError"]

[call]
api = "literalize"
sources = [
  '[{"id": 1}]',
  '[{"name":"one","payload":{"value":1}},{"name":"two","payload":{"other":2}}]',
]
input_format = "json"
variable_form = "both"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
]
