schema_version = 1
summary = """
A backend that encodes a nested collection as a string re-quotes at
every level, so its output grows exponentially with depth.  The first
unsafe depth is refused before that rendering starts.
"""
exceptions = ["ExcessiveNestingError"]
languages = ["Bash", "SystemVerilog"]

[call]
api = "literalize"
sources = ["[[[[[[[[[[[[[1]]]]]]]]]]]]]"]
input_format = "json"
