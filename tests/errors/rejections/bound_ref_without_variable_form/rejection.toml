schema_version = 1
summary = "A wrapped bare value cannot emit the declaration required by its bound reference."
exceptions = ["RefNotSelfContainedError"]

[call]
api = "literalize"
sources = ['{"a": {"$ref": "shared"}}']
input_format = "json"
variable_form = "none"
wrap_in_file = true
ref_key = "$ref"
bound_ref_yaml = { "shared" = "[1, 2]" }
