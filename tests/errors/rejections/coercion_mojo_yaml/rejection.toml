schema_version = 1
summary = "Mojo rejects heterogeneous scalar, sibling-list and mixed-container shapes after YAML parsing."
exceptions = ["HeterogeneousScalarCollectionError", "HeterogeneousSiblingListsError", "MixedDictValuesError", "MixedListValuesError"]
languages = ["Mojo"]

[call]
api = "literalize"
sources = [
  # Mixed scalar types in one array.
  "- 1\n- 2.5\n- 3\n",
  # Mixed scalar types in one dictionary.
  "a: 1\nb: 2.5\n",
  # A mixed dictionary inside a mixed list reports dictionary type families.
  "wrapper:\n- a: x\n  b:\n  - 1\n- text\n",
  # A null value beside a list.
  "tags:\n- admin\nextra:\n",
  # A string value beside a list.
  "name: Bob\ntags:\n- admin\n- user\n",
  # A string element beside a nested list.
  "- hello\n- - nested\n",
  # Mixed scalar types in a nested array.
  "- - 1\n  - hello\n",
  # Skip a homogeneous dictionary before finding a mixed one.
  "a:\n  x: 1\nb:\n  x: hello\n  y:\n  - 1\n",
  # Skip a homogeneous list before finding a mixed one.
  "- - 1\n  - 2\n- - hello\n  - - nested\n",
  # Heterogeneous sibling lists nested one level deeper.
  "- - - 1\n    - 2\n  - - a\n    - b\n",
  # Sibling lists with incompatible scalar element types.
  "- - 1\n  - 2\n- - a\n  - b\n",
]
input_format = "yaml"
variable_form = "none"
kwargs = [
  { kind = "option_member", option = "date_format", member = "ISO" },
  { kind = "option_member", option = "datetime_format", member = "ISO" },
  { kind = "option_member", option = "bytes_format", member = "HEX" },
  { kind = "option_member", option = "sequence_format", member = "LIST" },
]
