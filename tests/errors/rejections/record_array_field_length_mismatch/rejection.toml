schema_version = 1
summary = "Exercise a record-array field whose length changes between instances of one shape."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize"
sources = [
  "items:\n- sub:\n  - x: 1\n- sub:\n  - x: 2\n  - x: 3\n",
  "- group:\n  - x: 1\n- group:\n  - x: 1\n  - x: 2\n",
]
input_format = "yaml"
variable_form = "new"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
]
