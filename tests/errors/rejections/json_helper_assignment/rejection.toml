schema_version = 1
summary = "Zig json assignment bindings cannot shadow the mode's helpers."
exceptions = ["ReservedVariableNameError"]
values = ["allocator", "std"]

[call]
api = "literalize"
sources = ['{"a":1}']
input_format = "json"
wrap_in_file = true
variable_form = "existing"
variable_name = "{value}"
kwargs = [{ kind = "option_member", option = "json_type", member = "STD_JSON_VALUE" }]
