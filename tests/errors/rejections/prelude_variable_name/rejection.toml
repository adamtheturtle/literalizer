schema_version = 1
summary = "Exercise declaration names that overlap standard prelude or entrypoint names."
exceptions = ["ReservedVariableNameError"]
values = ["abs", "foldl'", "length", "main", "map", "print", "seq"]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
