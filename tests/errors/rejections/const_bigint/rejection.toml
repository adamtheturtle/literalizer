schema_version = 1
summary = "Exercise constant declarations of integers that need a runtime parser."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize"
sources = ['{"big": 12345678901234567890123}']
input_format = "json"
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "declaration_style", member = "CONST" },
]
