schema_version = 1
summary = "Exercise call targets that overlap symbols in a locked standard package."
exceptions = ["InvalidCallTargetError"]
values = [
  "MOD",
  "abs",
  "assert",
  "class",
  "defun",
  "error",
  "flet",
  "if",
  "labels",
  "lambda",
  "length",
  "let",
  "list",
  "loop",
  "max",
  "min",
  "mod",
  "not",
  "null",
  "open",
  "or",
  "progn",
  "quote",
  "rem",
  "return",
  "setq",
  "type",
  "when",
]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
