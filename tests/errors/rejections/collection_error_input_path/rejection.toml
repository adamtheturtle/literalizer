languages = ["Rust"]

[attributes]
path = ["users", 1, "tags"]

[call]
api = "literalize"
sources = ["{\"users\": [{\"name\": \"a\", \"tags\": [\"x\", \"y\"]}, {\"name\": \"b\", \"tags\": [1, \"z\"]}]}"]
