schema_version = 1
summary = "Exercise a nested tuple supplied through a bound reference."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize"
sources = [
    '[{"$ref":"shared"},{"$ref":"shared"}]',
]
input_format = "json"
wrap_in_file = true
ref_key = "$ref"
variable_form = "new"
bound_ref_yaml = { shared = "[1, x]" }
kwargs = [{ kind = "option_member", option = "sequence_format", member = "TUPLE" }]
