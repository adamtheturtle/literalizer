schema_version = 1
summary = "Exercise YAML collections mixing tagged binary, sets, ordered maps, and temporal scalars."
exceptions = ["HeterogeneousScalarCollectionError", "MixedDictValuesError"]

[call]
api = "literalize"
sources = [
  "key1: !!binary |\n  SGVsbG8=\nkey2: 42\n",
  "- 2024-01-15\n- 42\n",
  "- 2024-01-15T12:30:00\n- 42\n",
  "name: Alice\nroles: !!set\n  ? admin\n",
  "--- !!omap\n  - name: Alice\n  - score: 42\n  - tags:\n    - admin\n",
  "--- !!omap\n  - name: Alice\n  - age: 30\n",
  "--- !!set\n? 1\n? \"hello\"\n",
]
input_format = "yaml"
include_delimiters = true
kwargs = [
  { kind = "option_member", option = "date_format", member = "ISO" },
  { kind = "option_member", option = "datetime_format", member = "ISO" },
  { kind = "option_member", option = "bytes_format", member = "HEX" },
  { kind = "option_member", option = "sequence_format", member = "LIST" },
]
