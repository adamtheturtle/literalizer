schema_version = 1
summary = "A Jsonnet keyword cannot name a function parameter."
exceptions = ["InvalidCallParameterNameError"]
languages = ["Jsonnet"]
values = ["assert", "else", "error", "false", "for", "function", "if", "import", "importbin", "importstr", "in", "local", "null", "self", "super", "tailstrict", "then", "true"]

[call]
api = "literalize_call"
sources = ["[[1]]"]
input_format = "json"
target_function = "f"
parameter_names = ["{value}"]
wrap_in_file = true
