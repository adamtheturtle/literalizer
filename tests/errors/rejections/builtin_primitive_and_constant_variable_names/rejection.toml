schema_version = 1
summary = "Exercise declaration names that overlap primitives, constants, or the entrypoint."
exceptions = ["ReservedVariableNameError"]
values = [
  "anyerror",
  "bool",
  "c_int",
  "comptime_int",
  "f16",
  "false",
  "i33",
  "main",
  "null",
  "true",
  "type",
  "u7",
  "undefined",
  "usize",
  "void",
]

[call]
api = "literalize"
sources = ['{"a": 1, "b": [1, 2]}']
input_format = "json"
wrap_in_file = true
variable_form = "new"
variable_name = "{value}"
