schema_version = 1
summary = "Exercise fixed-size call arrays with inconsistent nested lengths."
exceptions = ["CallArgNotSupportedError"]

[call]
api = "literalize_call"
sources = [
    '[[1,2],[3]]',
    '[[[1],[2]],[[3,4]]]',
    '{"first": [1, 2], "second": [3]}',
]
input_format = "json"
target_function = "make_widget"
parameter_names = ["items"]
per_element = false
variable_form = "new"
wrap_in_file = true
