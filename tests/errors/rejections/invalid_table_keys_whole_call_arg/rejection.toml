schema_version = 1
summary = "Call table construction rejects null and NaN indexes, including reference-valued keys (#6987)."
exceptions = ["UnrepresentableInputError"]

[call]
api = "literalize_call"
sources = ['{null: 1}', '{.nan: 1}', '{nested: {null: 1}}', '[{.nan: 1}]', '!!omap [{null: 1}]', '!!omap [{.nan: 1}]', '{nested: !!omap [{null: 1}]}', '[!!omap [{.nan: 1}]]', '{null: {"$ref": "item"}}', '!!omap [{.nan: {"$ref": "item"}}]', '!!set {null: null}', '!!set {.nan: null}', '{nested: !!set {null: null}}', '[!!set {.nan: null}]']
input_format = "yaml"
ref_key = "$ref"
ref_value_yaml = { item = "42" }
target_function = "consume"
parameter_names = ["value"]
per_element = false
