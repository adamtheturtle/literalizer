schema_version = 1
summary = """
Wrapped call stubs assume the generic value type, which Gleam and OCaml
concrete record modes do not define.
"""
exceptions = ["IncompatibleFormatsError"]
languages = ["Gleam", "OCaml"]

[call]
api = "literalize_call"
sources = ['[{"x":1}]']
input_format = "json"
target_function = "consume"
parameter_names = ["item"]
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
]
