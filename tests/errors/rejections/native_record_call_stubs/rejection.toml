schema_version = 1
summary = "Exercise wrapped call stubs with concrete record types and generic parameter carriers."
exceptions = ["IncompatibleFormatsError"]

[call]
api = "literalize_call"
sources = ['[{"x":1}]']
input_format = "json"
target_function = "consume"
parameter_names = ["item"]
wrap_in_file = true
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
]
