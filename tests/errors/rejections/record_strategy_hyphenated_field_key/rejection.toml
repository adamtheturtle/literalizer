schema_version = 1
summary = """
A hyphenated dict key has no lexical field identifier in most record
renderers, and is refused before the target language is handed source
it cannot compile.
"""
exceptions = ["UnrepresentableInputError"]
gates = [
  { kind = "enum_member_present", option = "heterogeneous_strategy", member = "RECORD" },
]

[call]
api = "literalize"
sources = ['[{"a-b": 1}]']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "heterogeneous_strategy", member = "RECORD" },
]
