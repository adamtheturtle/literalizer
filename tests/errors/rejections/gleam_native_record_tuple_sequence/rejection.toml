schema_version = 1
summary = "Gleam tuple sequences cannot supply the uniform list types of record fields."
exceptions = ["IncompatibleFormatsError"]
languages = ["Gleam"]

[call]
api = "literalize"
sources = ['{"x":[1]}']
input_format = "json"
kwargs = [
  { kind = "option_member", option = "dict_format", member = "RECORD" },
  { kind = "option_member", option = "sequence_format", member = "TUPLE" },
]
