schema_version = 1
summary = "Exercise case, lambda, and match as generated call targets."
exceptions = ["InvalidCallTargetError"]
values = ["case", "lambda", "match"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
