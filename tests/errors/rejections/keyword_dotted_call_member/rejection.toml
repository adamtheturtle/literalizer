schema_version = 1
summary = "Exercise keywords as fields declared for dotted call targets."
exceptions = ["InvalidCallTargetError"]
values = ["assert", "else", "error", "false", "for", "function", "if", "import", "importbin", "importstr", "in", "local", "null", "self", "super", "tailstrict", "then", "true"]

[call]
api = "literalize_call"
sources = ["[[1, 2]]"]
input_format = "json"
target_function = "mod.{value}"
parameter_names = ["a", "b"]
wrap_in_file = true
