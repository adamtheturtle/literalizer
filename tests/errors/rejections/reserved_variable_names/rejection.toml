schema_version = 1
summary = "Exercise reserved words as data-item declaration names. (#4771)"
exceptions = ["ReservedVariableNameError"]
values = [
    "all",
    "copy",
    "count",
    "date",
    "day",
    "first",
    "key",
    "last",
    "length",
    "number",
    "object",
    "self",
    "size",
    "string",
    "test",
    "time",
    "type",
]

[call]
api = "literalize"
sources = ['{"a": 1}']
input_format = "json"
variable_form = "new"
variable_name = "{value}"
wrap_in_file = true
