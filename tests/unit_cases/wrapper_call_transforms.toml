[[cases]]
name = "wrapper_zip"
arguments = ["call", "zipped"]
outer = ""
uses_zipped = true

[[cases]]
name = "outer_zip"
arguments = ["call"]
outer = "{call} then {zipped}"
uses_zipped = true

[[cases]]
name = "outer_without_zip"
arguments = ["call"]
outer = "outer {call}"
uses_zipped = false

[[cases]]
name = "no_outer"
arguments = ["call"]
outer = ""
uses_zipped = false

[[errors]]
name = "unsupported_call_convention"
language = "Yaml"
has_zipped = true
per_element = false
message = "Native call wrapper requires a supported call convention"
error = "TypeError"

[[errors]]
name = "missing_zip_operand"
language = "Python"
has_zipped = false
per_element = false
message = "Native call wrapper requires a zipped operand"
error = "ValueError"

[[errors]]
name = "per_element_without_list"
language = "Python"
has_zipped = true
per_element = true
message = "Per-element call wrapper requires a zipped list"
error = "TypeError"
