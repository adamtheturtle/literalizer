# Versioned rejection-message validation and active-entry selection.

[[invalid]]
name = "missing_default"
source = '''[Error]
case = { "3.12" = "old" }'''
message = "requires a default"

[[invalid]]
name = "invalid_named_version"
source = '''[Error]
case = { default = "new", py312 = "old" }'''
message = "invalid Python version key"

[[invalid]]
name = "patch_version_not_supported"
source = '''[Error]
case = { default = "new", "3.12.1" = "old" }'''
message = "invalid Python version key"

[[invalid]]
name = "non_string_default"
source = '''[Error]
case = { default = 1 }'''
message = "valid string"

[[invalid]]
name = "non_string_message"
source = '''[Error]
case = 1'''
message = "valid string"

[[versions]]
name = "python_3_12"
version = "3.12"
source = '''[Error]
variant = { default = "modern", "3.12" = "older" }
plain = "old"
stale = "deleted case"
[StaleError]
case = "deleted exception"
'''
rejecting = 1
accepting = 0
expected_document = '''[Error]
variant = { default = "modern", "3.12" = "actual" }
plain = "actual"
new = "actual"
'''

[versions.actual_messages.Error]
variant = "actual"
plain = "actual"
new = "actual"
