# Positive and negative controls for semantic roundtrip verification.

[[mismatches]]
name = "true_to_one"
expected_json = "{\"value\": true}"
produced_json = "{\"value\": 1}"
exclude_keys = []

[[mismatches]]
name = "one_to_true"
expected_json = "{\"value\": 1}"
produced_json = "{\"value\": true}"
exclude_keys = []

[[mismatches]]
name = "false_to_zero"
expected_json = "{\"value\": false}"
produced_json = "{\"value\": 0}"
exclude_keys = []

[[mismatches]]
name = "zero_to_false"
expected_json = "{\"value\": 0}"
produced_json = "{\"value\": false}"
exclude_keys = []

[[mismatches]]
name = "nested_boolean_to_float"
expected_json = "{\"value\": [true]}"
produced_json = "{\"value\": [1.0]}"
exclude_keys = []

[[mismatches]]
name = "nested_float_to_boolean"
expected_json = "{\"value\": [0.0]}"
produced_json = "{\"value\": [false]}"
exclude_keys = []

[[mismatches]]
name = "nested_value_types_changed"
expected_json = "{\"value\": {\"nested\": [1, false]}}"
produced_json = "{\"value\": {\"nested\": [true, 0]}}"
exclude_keys = []

[[mismatches]]
name = "nested_value_types_reversed"
expected_json = "{\"value\": {\"nested\": [true, 0]}}"
produced_json = "{\"value\": {\"nested\": [1, false]}}"
exclude_keys = []

[[mismatches]]
name = "array_order_changed"
expected_json = "{\"value\": [1, 2]}"
produced_json = "{\"value\": [2, 1]}"
exclude_keys = []

[[mismatches]]
name = "array_length_changed"
expected_json = "{\"value\": [1]}"
produced_json = "{\"value\": [1, 2]}"
exclude_keys = []

[[mismatches]]
name = "null_to_zero"
expected_json = "{\"value\": null}"
produced_json = "{\"value\": 0}"
exclude_keys = []

[[mismatches]]
name = "string_to_boolean"
expected_json = "{\"value\": \"true\"}"
produced_json = "{\"value\": true}"
exclude_keys = []

[[mismatches]]
name = "object_key_changed"
expected_json = "{\"value\": {\"a\": 1}}"
produced_json = "{\"value\": {\"b\": 1}}"
exclude_keys = []

[[equivalent]]
name = "identical_scalar_types"
expected_json = "{\"value\": [true, false, 0, 1]}"
produced_json = "{\"value\": [true, false, 0, 1]}"
exclude_keys = []

[[equivalent]]
name = "integer_as_float"
expected_json = "{\"value\": 1}"
produced_json = "{\"value\": 1.0}"
exclude_keys = []

[[equivalent]]
name = "float_array_as_integers"
expected_json = "{\"value\": [0.0, 1.0]}"
produced_json = "{\"value\": [0, 1]}"
exclude_keys = []

[[equivalent]]
name = "object_order_and_numeric_equivalence"
expected_json = "{\"a\": {\"x\": false, \"y\": [1]}, \"b\": null}"
produced_json = "{\"b\": null, \"a\": {\"y\": [1.0], \"x\": false}}"
exclude_keys = []

[[equivalent]]
name = "excluded_value_changed"
expected_json = "{\"keep\": true, \"skip\": 1}"
produced_json = "{\"keep\": true, \"skip\": false}"
exclude_keys = ["skip"]

[[equivalent]]
name = "excluded_key_added"
expected_json = "{\"keep\": true}"
produced_json = "{\"keep\": true, \"skip\": 0}"
exclude_keys = ["skip"]
