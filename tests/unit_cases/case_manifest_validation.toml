# Validation scenarios for case-local golden manifests.

[[cases]]
name = "call_transform_add_one_and_call_transform_nullable_conditional_are_mutually_exclusive"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
call_transform_add_one = true
call_transform_nullable_conditional = true
'''
message = "call_transform_add_one and call_transform_nullable_conditional are mutually exclusive"

[[cases]]
name = "call_transform_sequence_and_call_transform_add_one_are_mutually_exclusive"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
call_transform_sequence = true
call_transform_add_one = true
'''
message = "call_transform_sequence and call_transform_add_one are mutually exclusive"

[[cases]]
name = "call_transform_wrapper_requires_a_declared_transform_stub"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
call_transform_wrapper = {target = "emit", arguments = ["call"]}
'''
message = "call_transform_wrapper requires a declared transform stub"

[[cases]]
name = "wrapper_operands_must_match_transform_stub_param_names"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
transform_stub_names = ["emit"]
call_transform_wrapper = {target = "emit", arguments = ["call", "call"]}
'''
message = "wrapper operands must match transform_stub_param_names"

[[cases]]
name = "a_zipped_wrapper_operand_requires_zip_source"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
transform_stub_names = ["emit"]
call_transform_wrapper = {target = "emit", arguments = ["zipped"]}
'''
message = "a zipped wrapper operand requires zip_source"

[[cases]]
name = "call_transform_wrapper_and_call_transform_sequence_are_mutually_exclusive"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
transform_stub_names = ["emit"]
call_transform_wrapper = {target = "emit", arguments = ["call"]}
call_transform_sequence = true
'''
message = "call_transform_wrapper and call_transform_sequence are mutually exclusive"

[[cases]]
name = "call_transform_group_and_call_transform_sequence_are_mutually_exclusive"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
call_transform_group = {body = "{call}", suffix = ""}
call_transform_sequence = true
'''
message = "call_transform_group and call_transform_sequence are mutually exclusive"

[[cases]]
name = "call_transform_group_and_call_transform_arguments_are_mutually_exclusive"
manifest = '''schema_version = 1
owner = "literalize-call"
[call]
target_function = "target"
parameter_names = ["value"]
per_element = false
call_transform_group = {body = "{call}", suffix = ""}
call_transform_arguments = {arguments = ["token"], suffix = ""}
'''
message = "call_transform_group and call_transform_arguments are mutually exclusive"

