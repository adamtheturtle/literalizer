# Validation scenarios for case-local golden manifests.

[[cases]]
name = "unknown_alternative_capability"
manifest = '''schema_version = 1
suites = ["base"]
any_gates = [{kind = "capability_flag", flag = "does_not_exist"}]
'''
message = "any_gates: unknown capability flag"

