# Unwrapped result views are embedded in compiling integration goldens.
# Direct assertions remain for record metadata with no rendered surface.
record_input_case = "dict_mixed_scalars"
records = ["Cpp", "Go", "Java", "Kotlin", "Rust", "Scala"]

[prefix]
languages = ["Elm", "FSharp", "Haskell", "PureScript"]
input_case = "comment_scalar"
attributes = ["code", "bare_code"]
variable_name = "my_data"
