# Invalid rejection manifests, operations, declarations, and arguments.

[[cases]]
name = "legacy_modifier_language"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]


[call]
api = "constructor"
modifier_language = "LegacyLanguage"
'''
message = "Extra inputs are not permitted"

[[cases]]
name = "legacy_language_list"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]
languages = ["LegacyLanguage"]

[call]
api = "constructor"
'''
message = "Extra inputs are not permitted"

[[cases]]
name = "legacy_acceptance_language_list"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]

[[accepts]]
languages = ["LegacyLanguage"]
reason = "renders"
[call]
api = "constructor"
'''
message = "Extra inputs are not permitted"

[[cases]]
name = "values_contains_a_duplicate_entry"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]

values = ["a", "a"]
[call]
api = "constructor"
'''
message = "values contains a duplicate entry"

[[cases]]
name = "modifier_source_all_requires_modifiers"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]


[call]
api = "literalize"
sources = ["1"]
input_format = "json"
variable_form = "new"
modifier_source = "all"
'''
message = "modifier_source = 'all' requires modifiers"

[[cases]]
name = "unknown_modifier_source"
manifest = '''schema_version = 1
summary = "example"
exceptions = ["IncompatibleFormatsError"]


[call]
api = "literalize"
sources = ["1"]
input_format = "json"
variable_form = "new"
modifiers = ["FINAL"]
modifier_source = "Missing"
'''
message = "Input should be 'target' or 'all'"

[[cases]]
name = "unknown_top_level_field"
