[[datetime_offsets]]
name = "positive_second"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, 1)"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = 1000000

[[datetime_offsets]]
name = "negative_second"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, -1)"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = -1000000

[[datetime_offsets]]
name = "positive_microsecond"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, Rational(1, 1000000))"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = 1

[[datetime_offsets]]
name = "negative_microsecond"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, Rational(-1, 1000000))"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = -1

[[datetime_offsets]]
name = "positive_mixed"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, Rational(19815000001, 1000000))"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = 19815000001

[[datetime_offsets]]
name = "negative_mixed"
language = "Ruby"
expected = "Time.new(2001, 2, 3, 4, 5, 6, Rational(-19815000001, 1000000))"

[datetime_offsets.value]
wall_time = 2001-02-03T04:05:06
offset_microseconds = -19815000001

[[empty_call_wrappers]]
name = "empty_call_preamble"
language = "Roc"
calls = "call"
expected = "module [main]\n\nmain =\n    dbg (call)\n    {}"
