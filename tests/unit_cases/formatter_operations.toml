# Formatter-only contracts from issues #4699 and #6574.

[[integer_suffixes]]
name = "retain_existing_suffix"
value = -2147483648
rendered = "-0x80000000LL"
suffix = "LL"
base_suffix = "LL"
expected = "-0x80000000LL"

[[integer_suffixes]]
name = "widen_existing_suffix"
value = -2147483648
rendered = "-0x80000000L"
suffix = "LL"
base_suffix = "L"
expected = "-0x80000000LL"

[[date_views]]
name = "ruby_1500-03-01"
language = "Ruby"
format = "RUBY"
value = 1500-03-01T00:00:00Z
expected = "Date.new(1500, 3, 1, Date::GREGORIAN)"

[[date_views]]
name = "ruby_short_1500-03-01"
language = "Ruby"
format = "RUBY_SHORT"
value = 1500-03-01T00:00:00Z
expected = "Date.new(1500, 3, 1, Date::GREGORIAN)"

