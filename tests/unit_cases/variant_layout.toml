# Call and reference layout precedence with explicit and omitted settings.

[[cases]]
name = "call_omitted_over_compact"
kind = "call"
axis_layout = "compact"
expected_layout = "compact"
original_layout = "compact"

[cases.settings]
target_function = "consume"
parameter_names = ["value"]
per_element = false

